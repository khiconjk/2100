name: Build o1s Ghost Uptime (Custom)

on:
  workflow_dispatch:
    inputs:
      kernel_name:
        description: "Kernel version suffix (LOCALVERSION)"
        required: true
        default: "-22936777-abG991BXXS3BUL1"
        type: string
      commit_ref:
        description: "Commit SHA or branch to build from"
        required: true
        default: "c62dd93c7b9e52b16abfb9ad0ae6c652ce670386"
        type: string
      ksu:
        description: "Include KernelSU-Next"
        required: true
        default: "y"
        type: choice
        options:
          - "y"
          - "N"
      susfs:
        description: "Apply SuSFS with KernelSU-Next"
        required: true
        default: "y"
        type: choice
        options:
          - "y"
          - "N"
      recovery:
        description: "Build Android Recovery image"
        required: true
        default: "N"
        type: choice
        options:
          - "N"
          - "y"
      artifact_tag:
        description: "Artifact tag suffix (e.g. v101, custom-1)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: o1s-custom-${{ inputs.commit_ref }}-${{ inputs.kernel_name }}
  cancel-in-progress: true

jobs:
  build:
    name: o1s / ${{ inputs.commit_ref }} / ${{ inputs.ksu == 'y' && 'KSU' || 'VANILLA' }}${{ inputs.susfs == 'y' && '+SUSFS' || '' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    env:
      DEVICE: o1s
      KSU_OPTION: ${{ inputs.ksu }}
      SUSFS_OPTION: ${{ inputs.susfs }}
      RECOVERY_OPTION: ${{ inputs.recovery }}
      KERNEL_NAME: ${{ inputs.kernel_name }}
      COMMIT_REF: ${{ inputs.commit_ref }}
      ARTIFACT_TAG: ${{ inputs.artifact_tag }}
      GHOST_DEVICE_AGE_MODE: session
      GHOST_UPTIME_MIN_DAYS: "15"
      GHOST_UPTIME_MAX_DAYS: "25"
      ARTIFACT_DIR: ghost-uptime-artifact
      BUILD_LOG: build-full.log
      STATIC_LOG: ghost-uptime-static-check.log
      BUILD_EXIT_FILE: build-exit-code.txt

    steps:
      # ============================================================
      # 1. CHECKOUT — pinned to exact commit, independent of other refs
      # ============================================================
      - name: Checkout repository at target commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_ref }}
          fetch-depth: 0
          submodules: false

      - name: Record source info
        shell: bash
        run: |
          set -euo pipefail
          echo "=== SOURCE INFO ===" | tee "$BUILD_LOG"
          echo "COMMIT=$(git rev-parse HEAD)" | tee -a "$BUILD_LOG"
          echo "BRANCH=$(git branch --show-current 2>/dev/null || echo 'detached')" | tee -a "$BUILD_LOG"
          echo "SUBJECT=$(git log --format=%s -1)" | tee -a "$BUILD_LOG"
          echo "KERNEL_LOCALVERSION=$KERNEL_NAME" | tee -a "$BUILD_LOG"

      # ============================================================
      # 2. DEPENDENCIES
      # ============================================================
      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            bc bison build-essential cpio flex git kmod libelf-dev libssl-dev \
            lld llvm pahole python3 rsync unzip wget zip lz4

      - name: Initialize required submodules
        shell: bash
        run: |
          set -euo pipefail

          echo "--- Initializing toolchain/mkbootimg ---"
          git submodule sync -- toolchain/mkbootimg
          git submodule update --init --depth=1 toolchain/mkbootimg || {
            echo "WARNING: mkbootimg submodule failed, downloading manually..."
            mkdir -p toolchain/mkbootimg
            wget -qO toolchain/mkbootimg/mkbootimg.py \
              "https://raw.githubusercontent.com/osm0sis/mkbootimg/master/mkbootimg.py" \
              || wget -qO toolchain/mkbootimg/mkbootimg.py \
              "https://android.googlesource.com/platform/system/tools/mkbootimg/+/refs/heads/main/mkbootimg.py?format=TEXT" \
              || abort "Cannot obtain mkbootimg.py"
            if file toolchain/mkbootimg/mkbootimg.py | grep -q text; then
              echo "mkbootimg.py downloaded successfully"
            else
              base64 -d toolchain/mkbootimg/mkbootimg.py > toolchain/mkbootimg/mkbootimg_decoded.py
              mv toolchain/mkbootimg/mkbootimg_decoded.py toolchain/mkbootimg/mkbootimg.py
            fi
          }

          test -f toolchain/mkbootimg/mkbootimg.py || {
            echo "::error::mkbootimg.py not found after initialization!"
            exit 1
          }
          chmod +x toolchain/mkbootimg/mkbootimg.py
          echo "mkbootimg.py ready: $(head -1 toolchain/mkbootimg/mkbootimg.py)"

          echo "--- Initializing KernelSU-Next ---"
          if [[ "$KSU_OPTION" == "y" ]]; then
            git submodule sync -- KernelSU-Next
            git submodule update --init --depth=1 KernelSU-Next || {
              echo "KSU submodule failed, cloning manually..."
              git clone --depth=1 https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU-Next
            }
            test -d KernelSU-Next/kernel || {
              echo "::error::KernelSU-Next source not found!"
              exit 1
            }
          fi

          echo "--- Submodule status ---"
          git submodule status || true

      # ============================================================
      # 3. CONFIGURE GHOST UPTIME POLICY
      # ============================================================
      - name: Configure ghost uptime policy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR"
          if [ -f scripts/configure_ghost_uptime.sh ]; then
            chmod +x scripts/configure_ghost_uptime.sh \
              scripts/check_ghost_uptime_tree.sh \
              scripts/check_ghost_uptime_device.sh \
              scripts/make_ghost_uptime_report.sh
            scripts/configure_ghost_uptime.sh "$ARTIFACT_DIR"
          else
            echo "configure_ghost_uptime.sh not found, skipping config step."
          fi

      - name: Validate ghost uptime source invariants
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          if [ -f scripts/check_ghost_uptime_tree.sh ]; then
            scripts/check_ghost_uptime_tree.sh 2>&1 | tee "$STATIC_LOG" || true
          else
            echo "Static checker not available." | tee "$STATIC_LOG"
          fi

      # ============================================================
      # 4. PATCH LOCALVERSION FOR CUSTOM KERNEL NAME
      # ============================================================
      - name: Apply custom kernel name (LOCALVERSION)
        shell: bash
        run: |
          set -euo pipefail
          echo "Setting kernel LOCALVERSION to: $KERNEL_NAME"
          sed -i "s|export LOCALVERSION=.*|export LOCALVERSION=\"$KERNEL_NAME\"|" build.sh
          grep 'export LOCALVERSION' build.sh | tee -a "$BUILD_LOG"

      # ============================================================
      # 5. BUILD KERNEL
      # ============================================================
      - name: Build kernel
        id: kernel_build
        continue-on-error: true
        shell: bash
        run: |
          set +e
          chmod +x build.sh
          echo "" | tee -a "$BUILD_LOG"
          echo "=== BUILD START === $(date -u +'%Y-%m-%dT%H:%M:%SZ')" | tee -a "$BUILD_LOG"
          echo "COMMAND: ./build.sh --model $DEVICE --ksu $KSU_OPTION --susfs $SUSFS_OPTION --recovery $RECOVERY_OPTION" | tee -a "$BUILD_LOG"
          ./build.sh --model "$DEVICE" --ksu "$KSU_OPTION" \
            --susfs "$SUSFS_OPTION" --recovery "$RECOVERY_OPTION" \
            2>&1 | tee -a "$BUILD_LOG"
          build_code=${PIPESTATUS[0]}
          echo "=== BUILD END === exit=$build_code $(date -u +'%Y-%m-%dT%H:%M:%SZ')" | tee -a "$BUILD_LOG"
          printf '%d\n' "$build_code" > "$BUILD_EXIT_FILE"
          exit "$build_code"

      # ============================================================
      # 6. COLLECT ARTIFACTS
      # ============================================================
      - name: Collect artifacts and diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR/output"
          cp -f "$BUILD_LOG" "$ARTIFACT_DIR/" 2>/dev/null || true
          cp -f "$STATIC_LOG" "$ARTIFACT_DIR/" 2>/dev/null || true
          cp -f "$BUILD_EXIT_FILE" "$ARTIFACT_DIR/" 2>/dev/null || true
          cp -f out/.config "$ARTIFACT_DIR/kernel-config.txt" 2>/dev/null || true

          find build/out/$DEVICE -maxdepth 2 -type f \
            \( -name 'Image' -o -name '*.img' -o -name '*.zip' \) \
            -exec cp -f {} "$ARTIFACT_DIR/output/" \; 2>/dev/null || true

          ls -laR "$ARTIFACT_DIR/" | tee -a "$BUILD_LOG" || true

          if [ -f scripts/make_ghost_uptime_report.sh ]; then
            scripts/make_ghost_uptime_report.sh \
              --output "$ARTIFACT_DIR/ghost-uptime-report.txt" \
              --build-log "$BUILD_LOG" \
              --static-log "$STATIC_LOG" \
              --config "$ARTIFACT_DIR/ghost-uptime-config.env" 2>/dev/null || true
          fi

      # ============================================================
      # 7. DETERMINE ARTIFACT NAME
      # ============================================================
      - name: Set artifact name
        id: artifact_name
        shell: bash
        run: |
          set -euo pipefail
          SHORT_COMMIT=$(git rev-parse --short HEAD)
          TAG="${ARTIFACT_TAG:-${SHORT_COMMIT}}"
          KSU_TAG=""
          if [ "$KSU_OPTION" = "y" ] && [ "$SUSFS_OPTION" = "y" ]; then
            KSU_TAG="KSUN_SUSFS"
          elif [ "$KSU_OPTION" = "y" ]; then
            KSU_TAG="KSUN"
          else
            KSU_TAG="VANILLA"
          fi
          NAME="o1s-ghost-uptime-${TAG}-${KSU_TAG}-${{ github.run_number }}"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Artifact name: $NAME"

      # ============================================================
      # 8. UPLOAD ARTIFACTS
      # ============================================================
      - name: Upload kernel and diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact_name.outputs.name }}
          if-no-files-found: warn
          path: |
            ${{ env.ARTIFACT_DIR }}/**
            scripts/check_ghost_uptime_device.sh

      # ============================================================
      # 9. VERIFY BUILD SUCCESS
      # ============================================================
      - name: Verify build succeeded
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f "$BUILD_EXIT_FILE"
          EXIT_CODE=$(tr -d '[:space:]' < "$BUILD_EXIT_FILE")
          if [ "$EXIT_CODE" != "0" ]; then
            echo "::error::Kernel build failed with exit code $EXIT_CODE"
            tail -100 "$BUILD_LOG"
            exit 1
          fi
          echo "Kernel build completed successfully!"



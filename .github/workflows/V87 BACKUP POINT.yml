name: V87 BACKUP POINT

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-o1s.yml"
      - "build.sh"
      - "kernel/time/timekeeping.c"
      - "fs/stat.c"
      - "fs/proc/array.c"
      - "kernel/time/posix-timers.c"
      - "kernel/time/vsyscall.c"
      - "include/linux/ghost_uptime.h"
      - "kernel/ghost_uptime.c"
      - "kernel/Makefile"
      - "patches/uptime/**"
      - "arch/arm64/configs/**"
      - "drivers/rtc/**"
      - "dt.configs/**"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: false

      - name: Free disk space
        run: |
          set -e
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/hostedtoolcache || true
          sudo apt-get clean
          df -h

      - name: Install dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            git curl wget tar xz-utils zip unzip \
            build-essential bc bison flex \
            libssl-dev libelf-dev dwarves pahole \
            python3 python3-pip \
            cpio lz4 gzip kmod rsync ca-certificates

      - name: Hard clean old outputs
        run: |
          set -e
          echo "===== CLEAN OLD OUTPUTS ====="
          rm -rf out build/out AnyKernel3
          rm -f build.log uptime-patch-report.txt Module.symvers modules.order .scmversion
          find . -name "*.o" -delete || true
          find . -name "*.mod" -delete || true
          find . -name "*.mod.c" -delete || true
          find . -name ".*.cmd" -delete || true
          find . -name ".tmp_*" -type f -delete || true
          find . -name "*.a" -delete || true
          df -h

      - name: Prepare tools
        run: |
          set -e
          echo "===== PREPARE TOOLS ====="
          mkdir -p toolchain
          rm -rf toolchain/mkbootimg toolchain/libufdt
          rm -f toolchain/mkdtimg

          git clone --depth=1 https://android.googlesource.com/platform/system/tools/mkbootimg toolchain/mkbootimg
          git clone --depth=1 https://android.googlesource.com/platform/system/libufdt toolchain/libufdt

          echo "===== FIND MKDTIMG ====="
          find toolchain/libufdt -type f | grep -iE "mkdt.*\.py|mkdtbo.*\.py" || true

          if [ -f toolchain/libufdt/utils/src/mkdtboimg.py ]; then
            cp -f toolchain/libufdt/utils/src/mkdtboimg.py toolchain/mkdtimg
          elif [ -f toolchain/libufdt/utils/mkdtboimg.py ]; then
            cp -f toolchain/libufdt/utils/mkdtboimg.py toolchain/mkdtimg
          elif [ -f toolchain/libufdt/utils/src/mkdtimg.py ]; then
            cp -f toolchain/libufdt/utils/src/mkdtimg.py toolchain/mkdtimg
          elif [ -f toolchain/libufdt/utils/mkdtimg.py ]; then
            cp -f toolchain/libufdt/utils/mkdtimg.py toolchain/mkdtimg
          else
            echo "ERROR: mkdtimg/mkdtboimg script not found"
            exit 1
          fi

          chmod +x toolchain/mkdtimg
          python3 toolchain/mkbootimg/mkbootimg.py --help >/dev/null || true
          ls -lh toolchain/mkdtimg

      - name: Cache clang
        uses: actions/cache@v5
        with:
          path: toolchain/clang-r596125
          key: clang-r596125-linux-x86-stable-v3

      - name: Setup clang
        run: |
          set -e
          echo "===== SETUP CLANG ====="
          if [ ! -x "toolchain/clang-r596125/bin/clang" ]; then
            echo "Clang not found, downloading..."
            rm -rf toolchain/clang-r596125 toolchain/clang.tar.gz
            mkdir -p toolchain/clang-r596125
            wget -O toolchain/clang.tar.gz \
              "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/mirror-goog-main-llvm-toolchain-source/clang-r596125.tar.gz"
            tar -xf toolchain/clang.tar.gz -C toolchain/clang-r596125
          fi
          toolchain/clang-r596125/bin/clang --version

      - name: Patch build.sh safety fixes only
        run: |
          set -e
          echo "===== PATCH BUILD.SH SAFETY FIXES ====="
          chmod +x build.sh

          sed -i 's#refs/heads/master/clang-r596125.tar.gz#refs/heads/mirror-goog-main-llvm-toolchain-source/clang-r596125.tar.gz#g' build.sh || true
          sed -i 's#> ../$MODEl/vendor_ramdisk#> ../vendor_ramdisk#g' build.sh || true
          sed -i 's#> ../\$MODEl/vendor_ramdisk#> ../vendor_ramdisk#g' build.sh || true
          sed -i 's#git submodule update --init --force --depth=1 --recursive#echo "skip recursive submodules in CI"#g' build.sh || true

          # Disable the old dirty uptime patch block inside build.sh.
          # Reason: clean v87 owns uptime from kernel/ghost_uptime.c.
          # build.sh still has old code that rewrites include/linux/ghost_uptime.h,
          # injects arch_sys_boot_offset into fs/stat.c, and exits if timekeeping.c
          # does not contain arch_sys_boot_offset. That conflicts with clean v87.
          python3 - <<'PYFIX'
          from pathlib import Path
          import re

          p = Path('build.sh')
          s = p.read_text(errors='ignore')

          start_pat = r'# ================= GHOST UPTIME HEADER ================='
          end_pat = r'# ================= FIX RTC API ================='

          start = s.find(start_pat)
          end = s.find(end_pat, start if start >= 0 else 0)

          if start >= 0 and end > start:
              replacement = (
                  '# ================= GHOST UPTIME HEADER =================\n'
                  'echo "CI: old build.sh uptime block disabled; clean ghost_uptime v87 already applied"\n'
                  '# ================= PATCH STAT =================\n'
                  '# disabled by CI clean v87\n'
                  '# ================= PATCH TIMEKEEPING EXPORT =================\n'
                  '# disabled by CI clean v87\n'
              )
              s = s[:start] + replacement + s[end:]
          else:
              # Fallback for compact/minified build.sh variants.
              s = re.sub(
                  r'# ================= GHOST UPTIME HEADER =================.*?# ================= FIX RTC API =================',
                  '# ================= GHOST UPTIME HEADER =================\n'
                  'echo "CI: old build.sh uptime block disabled; clean ghost_uptime v87 already applied"\n'
                  '# ================= FIX RTC API =================',
                  s,
                  count=1,
                  flags=re.S,
              )

          if 'ERROR: arch_sys_boot_offset not found in kernel/time/timekeeping.c' in s:
              raise SystemExit('ERROR: failed to remove old build.sh arch_sys_boot_offset check')
          if 'GHOST UPTIME FOR STAT' in s or 'arch_sys_boot_offset đã được define' in s:
              raise SystemExit('ERROR: failed to remove old build.sh stat/arch uptime block')

          p.write_text(s)
          print('build.sh old uptime block disabled for clean v87')
          PYFIX

          grep -n "clang-r596125\|vendor_ramdisk\|MODEl\|submodule\|ghost_uptime\|arch_sys_boot_offset" build.sh || true

      - name: Apply clean ghost uptime V87
        run: |
          set -e
          echo "===== APPLY CLEAN GHOST UPTIME V87 ====="
          mkdir -p scripts
          cat > scripts/ci_apply_ghost_uptime_v87.py <<'PY'
          import pathlib
          import re
          import sys
          
          ROOT = pathlib.Path('.')
          TIMEKEEPING = ROOT / 'kernel/time/timekeeping.c'
          STAT = ROOT / 'fs/stat.c'
          HEADER = ROOT / 'include/linux/ghost_uptime.h'
          MODULE = ROOT / 'kernel/ghost_uptime.c'
          KMAKE = ROOT / 'kernel/Makefile'
          REPORT = ROOT / 'uptime-patch-report.txt'
          ARRAY = ROOT / 'fs/proc/array.c'
          POSIX = ROOT / 'kernel/time/posix-timers.c'
          VSYSCALL = ROOT / 'kernel/time/vsyscall.c'
          
          def die(msg):
              raise SystemExit('ERROR: ' + msg)
          
          def read(path):
              if not path.exists():
                  die(f'missing {path}')
              return path.read_text(errors='ignore')
          
          def write(path, data):
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(data)
          
          def add_include_once(data, inc):
              if inc in data:
                  return data
              include_lines = list(re.finditer(r'^#include\s+<[^>]+>\s*$', data, flags=re.M))
              if not include_lines:
                  die(f'no #include anchor for {inc}')
              last = include_lines[-1]
              return data[:last.end()] + '\n' + inc + data[last.end():]
          
          report = []
          
          # ------------------------------------------------------------------
          # 1) New clean module: one owner for offset generation and stat mapping
          # ------------------------------------------------------------------
          write(HEADER, '''#ifndef _LINUX_GHOST_UPTIME_H
          #define _LINUX_GHOST_UPTIME_H
          
          #include <linux/time64.h>
          #include <linux/types.h>
          
          struct inode;
          struct kstat;
          struct timespec64;
          struct task_struct;
          
          extern u64 ghost_uptime_offset_ns;
          extern u64 arch_sys_boot_offset;
          
          void ghost_uptime_apply_boot_offset(struct timespec64 *boot_offset,
          				       time64_t wall_sec);
          void ghost_uptime_apply_stat(struct inode *inode, struct kstat *stat);
          u64 ghost_uptime_get_offset_ns(void);
          unsigned long long ghost_uptime_apply_proc_start_time(struct task_struct *task,
          							     unsigned long long start_time);
          
          #endif /* _LINUX_GHOST_UPTIME_H */
          ''')
          
          write(MODULE, '''// SPDX-License-Identifier: GPL-2.0
          /*
           * Clean single-source uptime offset helper for o1s test builds.
           *
           * Rules:
           *  - the offset is generated once
           *  - only boot_offset is shifted in timekeeping_init()
           *  - timekeeping_get_delta(), raw clock, scheduler clock and printk clock stay untouched
           *  - stat timestamp adjustment reuses the same exported offset
           */
          
          #include <linux/bug.h>
          #include <linux/cache.h>
          #include <linux/export.h>
          #include <linux/fs.h>
          #include <linux/ghost_uptime.h>
          #include <linux/jiffies.h>
          #include <linux/math64.h>
          #include <linux/printk.h>
          #include <linux/sched.h>
          #include <linux/stat.h>
          #include <linux/string.h>
          #include <linux/time64.h>
          #include <linux/types.h>
          
          #define GHOST_UPTIME_MIN_DAYS	15ULL
          #define GHOST_UPTIME_MAX_DAYS	25ULL
          #define GHOST_UPTIME_DAY_SECS	86400ULL
          #define GHOST_UPTIME_MIN_SECS	(GHOST_UPTIME_MIN_DAYS * GHOST_UPTIME_DAY_SECS)
          #define GHOST_UPTIME_RANGE_SECS	((GHOST_UPTIME_MAX_DAYS - GHOST_UPTIME_MIN_DAYS + 1ULL) * GHOST_UPTIME_DAY_SECS)
          
          u64 ghost_uptime_offset_ns __read_mostly;
          EXPORT_SYMBOL_GPL(ghost_uptime_offset_ns);
          
          /*
           * Legacy compatibility symbol.
           * Older experimental patches in this tree may still reference
           * arch_sys_boot_offset from kernel/fork.c, kernel/printk/printk.c, etc.
           * Keep it exported and synced with the clean single-source offset so link
           * errors do not return while we migrate all surfaces into ghost_uptime.c.
           */
          u64 arch_sys_boot_offset __read_mostly;
          EXPORT_SYMBOL_GPL(arch_sys_boot_offset);
          
          static bool ghost_uptime_ready __read_mostly;
          
          static u64 ghost_uptime_mix64(u64 x)
          {
          	x ^= x >> 33;
          	x *= 0xff51afd7ed558ccdULL;
          	x ^= x >> 33;
          	x *= 0xc4ceb9fe1a85ec53ULL;
          	x ^= x >> 33;
          	return x;
          }
          
          static u64 ghost_uptime_read_counter(void)
          {
          	u64 counter = 0;
          
          #if defined(CONFIG_ARM64)
          	asm volatile("mrs %0, cntpct_el0" : "=r" (counter));
          #endif
          	return counter;
          }
          
          static u64 ghost_uptime_make_offset_secs(time64_t wall_sec)
          {
          	u64 seed = ghost_uptime_read_counter();
          	u64 secs;
          
          	seed ^= (u64)jiffies << 32;
          	seed ^= (u64)wall_sec;
          	seed ^= (u64)(unsigned long)&seed;
          	seed = ghost_uptime_mix64(seed);
          
          	secs = GHOST_UPTIME_MIN_SECS + (seed % GHOST_UPTIME_RANGE_SECS);
          
          	/* Small stable per-boot skew so repeated boots are not identical. */
          	if (wall_sec > 0)
          		secs += (u64)(wall_sec % 1800);
          
          	return secs;
          }
          
          void ghost_uptime_apply_boot_offset(struct timespec64 *boot_offset,
          				       time64_t wall_sec)
          {
          	u64 secs;
          
          	if (!boot_offset || ghost_uptime_ready)
          		return;
          
          	secs = ghost_uptime_make_offset_secs(wall_sec);
          	boot_offset->tv_sec += secs;
          	ghost_uptime_offset_ns = secs * NSEC_PER_SEC;
          	arch_sys_boot_offset = ghost_uptime_offset_ns;
          	ghost_uptime_ready = true;
          
          	pr_info("ghost_uptime: single-source-v87 offset_secs=%llu offset_days=%llu\\n",
          		secs, div64_u64(secs, GHOST_UPTIME_DAY_SECS));
          }
          
          u64 ghost_uptime_get_offset_ns(void)
          {
          	return ghost_uptime_offset_ns;
          }
          EXPORT_SYMBOL_GPL(ghost_uptime_get_offset_ns);
          
          static bool ghost_uptime_proc_comm_allowed(const char *comm)
          {
          	if (!comm)
          		return false;
          
          	/* Android core process names as exposed by task->comm/TASK_COMM_LEN. */
          	if (!strcmp(comm, "system_server"))
          		return true;
          	if (!strcmp(comm, "surfaceflinger"))
          		return true;
          	if (!strcmp(comm, "servicemanager"))
          		return true;
          	if (!strcmp(comm, "hwservicemanage"))
          		return true;
          	if (!strcmp(comm, "hwservicemanager"))
          		return true;
          	if (!strcmp(comm, "ndroid.systemui"))
          		return true;
          
          	/* Samsung/Android zygote64 and zygote often expose comm as "main". */
          	if (!strcmp(comm, "main"))
          		return true;
          
          	return false;
          }
          
          unsigned long long ghost_uptime_apply_proc_start_time(struct task_struct *task,
          						     unsigned long long start_time)
          {
          	u64 off_ticks;
          
          	if (!task || !ghost_uptime_offset_ns)
          		return start_time;
          
          	if (!ghost_uptime_proc_comm_allowed(task->comm))
          		return start_time;
          
          	off_ticks = nsec_to_clock_t(ghost_uptime_offset_ns);
          	if (!off_ticks)
          		return start_time;
          
          	if (start_time > off_ticks)
          		return start_time - off_ticks;
          
          	return 1;
          }
          EXPORT_SYMBOL_GPL(ghost_uptime_apply_proc_start_time);
          
          static bool ghost_uptime_stat_magic_allowed(unsigned long magic)
          {
          	switch (magic) {
          	case 0x9fa0:     /* procfs */
          	case 0x62656572: /* sysfs */
          	case 0x1021994:  /* tmpfs */
          	case 0x64626720: /* debugfs */
          	case 0x73636673: /* securityfs */
          	case 0x27e0eb:   /* cgroup */
          	case 0x6e736673: /* nsfs */
          	case 0x1373:
          		return true;
          	default:
          		return false;
          	}
          }
          
          static void ghost_uptime_sub_time64(struct timespec64 *ts, u64 off)
          {
          	if (!ts)
          		return;
          	if (ts->tv_sec > 0 && (u64)ts->tv_sec > off)
          		ts->tv_sec -= off;
          }
          
          void ghost_uptime_apply_stat(struct inode *inode, struct kstat *stat)
          {
          	u64 off;
          
          	if (!inode || !inode->i_sb || !stat || !ghost_uptime_offset_ns)
          		return;
          	if (!ghost_uptime_stat_magic_allowed(inode->i_sb->s_magic))
          		return;
          
          	off = div64_u64(ghost_uptime_offset_ns, NSEC_PER_SEC);
          	ghost_uptime_sub_time64(&stat->atime, off);
          	ghost_uptime_sub_time64(&stat->mtime, off);
          	ghost_uptime_sub_time64(&stat->ctime, off);
          }
          EXPORT_SYMBOL_GPL(ghost_uptime_apply_stat);
          ''')
          report.append('wrote include/linux/ghost_uptime.h')
          report.append('wrote kernel/ghost_uptime.c')
          report.append('legacy arch_sys_boot_offset compat symbol exported=1')
          
          # ------------------------------------------------------------------
          # 2) kernel/Makefile: build the helper module
          # ------------------------------------------------------------------
          km = read(KMAKE)
          if 'ghost_uptime.o' not in km:
              lines = km.splitlines()
              insert_at = 0
              for i, line in enumerate(lines):
                  if line.startswith('obj-y') or line.startswith('obj-$(CONFIG'):
                      insert_at = i
                      break
              lines.insert(insert_at, 'obj-y += ghost_uptime.o')
              km = '\n'.join(lines) + '\n'
              write(KMAKE, km)
              report.append('kernel/Makefile added obj-y += ghost_uptime.o')
          else:
              report.append('kernel/Makefile already contains ghost_uptime.o')
          
          # ------------------------------------------------------------------
          # 3) timekeeping.c: remove old delta injection; add one clean call
          # ------------------------------------------------------------------
          tk = read(TIMEKEEPING)
          tk_orig = tk
          tk = add_include_once(tk, '#include <linux/ghost_uptime.h>')
          
          # Remove older helpers and global variants.
          tk = re.sub(r'\n?\s*/\*\s*Fake Uptime.*?\*/\s*static\s+inline\s+u64\s+get_fake_boottime(?:_ns)?\s*\(\s*void\s*\)\s*\{.*?\}\s*', '\n', tk, flags=re.S)
          tk = re.sub(r'\n?\s*static\s+inline\s+u64\s+get_fake_boottime(?:_ns)?\s*\(\s*void\s*\)\s*\{.*?\}\s*', '\n', tk, flags=re.S)
          tk = re.sub(r'\n?\s*/\*\s*GHOST UPTIME SINGLE SOURCE V\d+.*?arch_sys_boot_offset\s*=\s*[^;]+;\s*\}\s*', '\n', tk, flags=re.S)
          tk = re.sub(r'\n?\s*/\*\s*---\s*GHOST PATCH:.*?/\*\s*-+\s*\*/', '\n', tk, flags=re.S)
          tk = re.sub(r'\n?\s*/\*\s*GHOST UPTIME SINGLE SOURCE V\d+.*?\*/\s*\{.*?arch_sys_boot_offset\s*=\s*[^;]+;\s*\}\s*', '\n', tk, flags=re.S)
          tk = re.sub(r'\n?\s*/\*\s*GHOST UPTIME GLOBAL VARIABLE.*?\*/\s*', '\n', tk, flags=re.S)
          tk = re.sub(r'\bu64\s+arch_sys_boot_offset\s*(?:=\s*0)?\s*;\s*(?:EXPORT_SYMBOL_GPL\s*\(\s*arch_sys_boot_offset\s*\)\s*;)?', '', tk)
          
          # Fix known bad duplicate signature from the old dirty patch.
          tk = re.sub(
              r'static\s+u64\s+timekeeping_get_delta\s*\(\s*const\s+struct\s+tk_read_base\s+\*tkr\s*\)\s*\{\s*'
              r'static\s+inline\s+u64\s+timekeeping_get_delta\s*\(\s*const\s+struct\s+tk_read_base\s+\*tkr\s*\)\s*\{',
              'static u64 timekeeping_get_delta(const struct tk_read_base *tkr)\n{',
              tk,
              flags=re.S,
          )
          tk = re.sub(r'return\s+delta\s*\+\s*get_fake_boottime(?:_ns)?\s*\(\s*\)\s*;', 'return delta;', tk)
          tk = re.sub(r'\s*\+\s*get_fake_boottime(?:_ns)?\s*\(\s*\)', '', tk)
          
          # Insert one call after boot_offset sanity clamp.
          call = '\n\tghost_uptime_apply_boot_offset(&boot_offset, wall_time.tv_sec);\n'
          if 'ghost_uptime_apply_boot_offset(&boot_offset, wall_time.tv_sec)' not in tk:
              anchors = [
                  'if (timespec64_compare(&wall_time, &boot_offset) < 0)\n\t\tboot_offset = (struct timespec64){0};',
                  'if (timespec64_compare(&wall_time, &boot_offset) < 0) boot_offset = (struct timespec64){0};',
              ]
              for anchor in anchors:
                  if anchor in tk:
                      tk = tk.replace(anchor, anchor + call, 1)
                      break
              else:
                  die('cannot find boot_offset sanity anchor in timekeeping_init()')
          
          if 'get_fake_boottime' in tk:
              die('old get_fake_boottime helper still remains in timekeeping.c')
          if re.search(r'return\s+delta\s*\+', tk):
              die('suspicious return delta + ... remains in timekeeping.c')
          if tk.count('ghost_uptime_apply_boot_offset(&boot_offset, wall_time.tv_sec)') != 1:
              die('ghost_uptime_apply_boot_offset call count is not exactly 1')
          
          write(TIMEKEEPING, tk)
          report.append(f'timekeeping.c changed={tk != tk_orig}')
          report.append('timekeeping.c single boot_offset call=1')
          
          # ------------------------------------------------------------------
          # 4) fs/stat.c: replace inline stat math with a helper call
          # ------------------------------------------------------------------
          st = read(STAT)
          st_orig = st
          st = add_include_once(st, '#include <linux/ghost_uptime.h>')
          st = re.sub(r'\n\s*#include\s+<linux/math64.h>\s*', '\n', st)
          
          # Remove older inline stat hook blocks.
          st = re.sub(r'\n?\s*/\*\s*---\s*GHOST UPTIME FOR STAT.*?\/\*\s*-+\s*\*/', '\n', st, flags=re.S)
          st = re.sub(r'\n?\s*/\*\s*GHOST UPTIME FOR STAT V\d+.*?\}\s*', '\n', st, flags=re.S)
          st = re.sub(r'\n?\s*extern\s+u64\s+arch_sys_boot_offset\s*;\s*', '\n', st)
          
          if 'ghost_uptime_apply_stat(inode, stat);' not in st:
              anchor = '\tstat->blocks = inode->i_blocks;'
              if anchor not in st:
                  anchor = 'stat->blocks = inode->i_blocks;'
              if anchor not in st:
                  die('cannot find stat->blocks anchor in fs/stat.c')
              st = st.replace(anchor, anchor + '\n\tghost_uptime_apply_stat(inode, stat);', 1)
          
          if st.count('ghost_uptime_apply_stat(inode, stat);') != 1:
              die('ghost_uptime_apply_stat call count is not exactly 1')
          if 'arch_sys_boot_offset' in st:
              die('old arch_sys_boot_offset reference remains in fs/stat.c')
          
          write(STAT, st)
          report.append(f'stat.c changed={st != st_orig}')
          report.append('stat.c helper call=1')
          
          
          # ------------------------------------------------------------------
          # 5) fs/proc/array.c: shift /proc/<pid>/stat field 22 for whitelisted core processes
          # ------------------------------------------------------------------
          ar = read(ARRAY)
          ar_orig = ar
          
          if '#include <linux/ghost_uptime.h>' not in ar:
              if '#include "internal.h"' in ar:
                  ar = ar.replace('#include "internal.h"', '#include "internal.h"\n#include <linux/ghost_uptime.h>', 1)
              else:
                  ar = '#include <linux/ghost_uptime.h>\n' + ar
          
          # Remove accidental duplicate calls from older CI attempts.
          ar = re.sub(r'\n?\s*start_time\s*=\s*ghost_uptime_apply_proc_start_time\s*\(\s*task\s*,\s*start_time\s*\)\s*;\s*', '\n', ar)
          
          needle = 'start_time = nsec_to_clock_t(task->real_start_time);'
          if needle not in ar:
              die('cannot find proc array start_time assignment')
          ar = ar.replace(needle, needle + '\n\tstart_time = ghost_uptime_apply_proc_start_time(task, start_time);', 1)
          
          if ar.count('ghost_uptime_apply_proc_start_time(task, start_time);') != 1:
              die('proc start_time helper call count is not exactly 1')
          
          write(ARRAY, ar)
          report.append(f'array.c changed={ar != ar_orig}')
          report.append('array.c proc stat field22 helper call=1')
          
          
          # ------------------------------------------------------------------
          # 6) V87 native clock path fix:
          #    - remove old broad syscall-side offset from posix-timers.c
          #    - re-add offset only for CLOCK_MONOTONIC_RAW syscall path
          #    - add the same RAW offset to vDSO basetime in kernel/time/vsyscall.c
          # ------------------------------------------------------------------
          
          # 6a) kernel/time/posix-timers.c
          px = read(POSIX)
          px_orig = px
          
          px = add_include_once(px, '#include <linux/ghost_uptime.h>')
          px = add_include_once(px, '#include <linux/math64.h>')
          
          px = re.sub(r'\n?\s*extern\s+u64\s+arch_sys_boot_offset\s*;\s*', '\n', px)
          
          px = re.sub(
              r'\n?\s*/\*={10,}\*/\s*'
              r'if\s*\(\s*!error\s*&&\s*arch_sys_boot_offset\s*>\s*0\s*\)\s*\{.*?'
              r'kernel_tp\.tv_sec\s*\+=\s*offset_secs\s*;\s*'
              r'\}\s*\}\s*'
              r'/\*={10,}\*/\s*',
              '\n',
              px,
              flags=re.S,
          )
          
          px = re.sub(
              r'\n?\s*if\s*\(\s*!err\s*&&\s*arch_sys_boot_offset\s*>\s*0\s*\)\s*\{.*?'
              r'ts\.tv_sec\s*\+=\s*offset_secs\s*;\s*'
              r'\}\s*\}\s*',
              '\n',
              px,
              flags=re.S,
          )
          
          px = re.sub(r'\n?\s*/\*\s*GHOST UPTIME V87 RAW syscall only.*?/\*\s*END GHOST UPTIME V87 RAW syscall only\s*\*/\s*', '\n', px, flags=re.S)
          
          raw_block_64 = '''
          /* GHOST UPTIME V87 RAW syscall only */
          if (!error && which_clock == CLOCK_MONOTONIC_RAW) {
          	u64 ghost_off_ns = ghost_uptime_get_offset_ns();
          
          	if (ghost_off_ns)
          		kernel_tp.tv_sec += div64_u64(ghost_off_ns, NSEC_PER_SEC);
          }
          /* END GHOST UPTIME V87 RAW syscall only */
          '''
          
          anchor_64 = 'error = kc->clock_get(which_clock, &kernel_tp);'
          if anchor_64 not in px:
              die('cannot find 64-bit posix clock_get anchor in posix-timers.c')
          px = px.replace(anchor_64, anchor_64 + raw_block_64, 1)
          
          raw_block_32 = '''
          /* GHOST UPTIME V87 RAW syscall only */
          if (!err && which_clock == CLOCK_MONOTONIC_RAW) {
          	u64 ghost_off_ns = ghost_uptime_get_offset_ns();
          
          	if (ghost_off_ns)
          		ts.tv_sec += div64_u64(ghost_off_ns, NSEC_PER_SEC);
          }
          /* END GHOST UPTIME V87 RAW syscall only */
          '''
          
          anchor_32 = 'err = kc->clock_get(which_clock, &ts);'
          if anchor_32 not in px:
              die('cannot find compat posix clock_get anchor in posix-timers.c')
          px = px.replace(anchor_32, anchor_32 + raw_block_32, 1)
          
          if 'arch_sys_boot_offset' in px:
              die('old arch_sys_boot_offset reference remains in posix-timers.c')
          if px.count('GHOST UPTIME V87 RAW syscall only') != 4:
              die('V87 RAW syscall blocks count mismatch in posix-timers.c')
          
          write(POSIX, px)
          report.append(f'posix-timers.c changed={px != px_orig}')
          report.append('posix-timers.c broad MONO/BOOT syscall x2 block removed=1')
          report.append('posix-timers.c RAW-only syscall offset blocks=2')
          
          # 6b) kernel/time/vsyscall.c
          vs = read(VSYSCALL)
          vs_orig = vs
          
          vs = add_include_once(vs, '#include <linux/ghost_uptime.h>')
          vs = add_include_once(vs, '#include <linux/math64.h>')
          
          vs = re.sub(r'\n?\s*/\*\s*GHOST UPTIME V87 vDSO RAW basetime.*?/\*\s*END GHOST UPTIME V87 vDSO RAW basetime\s*\*/\s*', '\n', vs, flags=re.S)
          
          raw_anchor = 'vdso_ts->sec\t= tk->raw_sec;'
          if raw_anchor not in vs:
              raw_anchor = 'vdso_ts->sec = tk->raw_sec;'
          if raw_anchor not in vs:
              die('cannot find vDSO RAW sec assignment in kernel/time/vsyscall.c')
          
          vdso_raw_block = '''
          /* GHOST UPTIME V87 vDSO RAW basetime */
          {
          	u64 ghost_off_ns = ghost_uptime_get_offset_ns();
          
          	if (ghost_off_ns)
          		vdso_ts->sec += div64_u64(ghost_off_ns, NSEC_PER_SEC);
          }
          /* END GHOST UPTIME V87 vDSO RAW basetime */
          '''
          
          vs = vs.replace(raw_anchor, raw_anchor + vdso_raw_block, 1)
          
          if 'ghost_uptime_get_offset_ns' not in vs:
              die('vDSO RAW offset helper missing in vsyscall.c')
          if vs.count('GHOST UPTIME V87 vDSO RAW basetime') != 2:
              die('V87 vDSO RAW block count mismatch in vsyscall.c')
          
          write(VSYSCALL, vs)
          report.append(f'vsyscall.c changed={vs != vs_orig}')
          report.append('vsyscall.c vDSO CLOCK_MONOTONIC_RAW basetime offset=1')
          
          
          # ------------------------------------------------------------------
          # 7) Disable stale uptime patch files in CI worktree only
          # ------------------------------------------------------------------
          old_dir = ROOT / 'patches/uptime'
          disabled = ROOT / 'patches/uptime-disabled'
          disabled.mkdir(parents=True, exist_ok=True)
          if old_dir.exists():
              moved = 0
              for p in old_dir.glob('*.patch'):
                  p.rename(disabled / (p.name + '.disabled'))
                  moved += 1
              report.append(f'disabled old patch files={moved}')
          
          REPORT.write_text('\n'.join(report) + '\n')
          print(REPORT.read_text())
          PY

          python3 scripts/ci_apply_ghost_uptime_v87.py

          echo "===== VERIFY CLEAN GHOST UPTIME V87 MARKERS ====="
          grep -RniE "ghost_uptime_apply_boot_offset|ghost_uptime_apply_stat|ghost_uptime_offset_ns|ghost_uptime: single-source-v87|get_fake_boottime|arch_sys_boot_offset|return[[:space:]]+delta[[:space:]]*\+" \
            kernel/time/timekeeping.c fs/stat.c include/linux/ghost_uptime.h kernel/ghost_uptime.c kernel/Makefile patches/uptime patches/uptime-disabled 2>/dev/null || true

          echo "===== GIT DIFF SUMMARY ====="
          git diff -- kernel/time/timekeeping.c fs/stat.c include/linux/ghost_uptime.h kernel/ghost_uptime.c kernel/Makefile patches/uptime patches/uptime-disabled | sed -n '1,320p' || true

      - name: Verify uptime patch is not x2 style
        run: |
          set -e
          echo "===== VERIFY NO DELTA INJECTION V87 ====="

          echo "Checking timekeeping.c for old delta injection only..."
          if grep -RniE "get_fake_boottime|return[[:space:]]+delta[[:space:]]*\+|tk_clock_read\(tkr\).*get_fake" kernel/time/timekeeping.c; then
            echo "ERROR: old x2-style delta injection still exists in timekeeping.c."
            exit 1
          fi

          echo "Checking fs/stat.c is helper-only and has no old global offset logic..."
          if grep -RniE "GHOST UPTIME FOR STAT|arch_sys_boot_offset" fs/stat.c; then
            echo "ERROR: old stat.c direct arch_sys_boot_offset logic still exists."
            exit 1
          fi

          echo "Checking clean boot_offset hook..."
          if ! grep -q "ghost_uptime_apply_boot_offset(&boot_offset, wall_time.tv_sec)" kernel/time/timekeeping.c; then
            echo "ERROR: clean boot_offset hook missing in timekeeping.c"
            exit 1
          fi

          echo "Checking clean stat helper hook..."
          if ! grep -q "ghost_uptime_apply_stat(inode, stat);" fs/stat.c; then
            echo "ERROR: clean stat helper hook missing in fs/stat.c"
            exit 1
          fi

          echo "Checking process age field22 hook..."
          if ! grep -q "ghost_uptime_apply_proc_start_time(task, start_time);" fs/proc/array.c; then
            echo "ERROR: process-age field22 hook missing in fs/proc/array.c"
            exit 1
          fi

          echo "Checking ghost_uptime module marker..."
          if ! grep -q "ghost_uptime: single-source-v87" kernel/ghost_uptime.c; then
            echo "ERROR: clean ghost_uptime module missing v87 marker"
            exit 1
          fi

          echo "Checking legacy compat symbol is exported only from ghost_uptime.c/header..."
          if ! grep -q "EXPORT_SYMBOL_GPL(arch_sys_boot_offset)" kernel/ghost_uptime.c; then
            echo "ERROR: legacy arch_sys_boot_offset compat export missing in ghost_uptime.c"
            exit 1
          fi

          if ! grep -q "obj-y += ghost_uptime.o" kernel/Makefile; then
            echo "ERROR: kernel/Makefile does not build ghost_uptime.o"
            exit 1
          fi

          echo "===== OCCURRENCE COUNTS ====="
          echo -n "boot_offset helper count: "
          grep -Rno "ghost_uptime_apply_boot_offset" kernel/time/timekeeping.c include/linux/ghost_uptime.h kernel/ghost_uptime.c | wc -l
          echo -n "stat helper count: "
          grep -Rno "ghost_uptime_apply_stat" fs/stat.c include/linux/ghost_uptime.h kernel/ghost_uptime.c | wc -l
          echo -n "proc starttime helper count: "
          grep -Rno "ghost_uptime_apply_proc_start_time" fs/proc/array.c include/linux/ghost_uptime.h kernel/ghost_uptime.c | wc -l
          echo -n "legacy arch_sys_boot_offset count: "
          grep -Rno "arch_sys_boot_offset" include/linux/ghost_uptime.h kernel/ghost_uptime.c kernel/fork.c kernel/printk/printk.c 2>/dev/null | wc -l


          echo "Checking V87 posix syscall path cleanup..."
          if grep -Rni "arch_sys_boot_offset" kernel/time/posix-timers.c; then
            echo "ERROR: broad arch_sys_boot_offset logic still exists in posix-timers.c"
            exit 1
          fi

          if ! grep -q "GHOST UPTIME V87 RAW syscall only" kernel/time/posix-timers.c; then
            echo "ERROR: V87 RAW-only syscall block missing in posix-timers.c"
            exit 1
          fi

          echo "Checking V87 vDSO RAW basetime offset..."
          if ! grep -q "GHOST UPTIME V87 vDSO RAW basetime" kernel/time/vsyscall.c; then
            echo "ERROR: V87 vDSO RAW basetime block missing in vsyscall.c"
            exit 1
          fi

          if ! grep -q "ghost_uptime_get_offset_ns" kernel/time/vsyscall.c; then
            echo "ERROR: vsyscall.c does not call ghost_uptime_get_offset_ns"
            exit 1
          fi

          echo "VERIFY_OK_V87"

      - name: Final clean before build
        run: |
          set -e
          rm -rf out build/out
          rm -f build.log Module.symvers modules.order .scmversion
          mkdir -p build/out/o1s
          find . -name "*.o" -delete || true
          find . -name "*.mod" -delete || true
          find . -name "*.mod.c" -delete || true
          find . -name ".*.cmd" -delete || true
          find . -name ".tmp_*" -type f -delete || true
          find . -name "*.a" -delete || true
          echo "Clean done."

      - name: Build kernel
        env:
          KSU_CHOICE: "y"
          SUSFS_CHOICE: "y"
          RECOVERY_CHOICE: "n"
        run: |
          set -e
          echo "===== BUILD o1s KERNEL ====="
          echo "KSU=$KSU_CHOICE SUSFS=$SUSFS_CHOICE RECOVERY=$RECOVERY_CHOICE"
          bash build.sh -m o1s -k "$KSU_CHOICE" -s "$SUSFS_CHOICE" -r "$RECOVERY_CHOICE" 2>&1 | tee build.log

      - name: Ensure TWRP flashable zip
        if: success()
        run: |
          set -e
          MODEL=o1s
          OUTDIR="build/out/$MODEL"
          FINAL_ZIP="$OUTDIR/TWRP-${MODEL}-KSUN-SUSFS-uptime-clean-v87.zip"

          echo "===== TWRP FLASHABLE ZIP CHECK ====="
          mkdir -p "$OUTDIR"

          if ! ls "$OUTDIR"/*.zip >/dev/null 2>&1; then
            echo "No zip produced by build.sh. Creating AnyKernel3 flashable zip fallback."

            for f in boot.img vendor_boot.img dtbo.img; do
              if [ ! -f "$OUTDIR/$f" ]; then
                echo "ERROR: $OUTDIR/$f missing. Cannot create TWRP flashable zip."
                find "$OUTDIR" -type f | sort || true
                exit 1
              fi
            done

            rm -rf AnyKernel3
            git clone --depth=1 -b t2s https://github.com/xfwdrev/AnyKernel3.git AnyKernel3

            rm -f AnyKernel3/boot.img AnyKernel3/vendor_boot.img AnyKernel3/dtbo.img
            cp -f "$OUTDIR/boot.img" AnyKernel3/boot.img
            cp -f "$OUTDIR/vendor_boot.img" AnyKernel3/vendor_boot.img
            cp -f "$OUTDIR/dtbo.img" AnyKernel3/dtbo.img

            if [ -f AnyKernel3/anykernel.sh ]; then
              sed -i "s/^device\.name1=.*/device.name1=$MODEL/" AnyKernel3/anykernel.sh || true
            fi

            pushd AnyKernel3 >/dev/null
            zip -r9 "../$FINAL_ZIP" * -x ".git*" "README.md" "*placeholder" >/dev/null
            popd >/dev/null
          else
            ZIP_SRC="$(ls -1t "$OUTDIR"/*.zip | head -n1)"
            if [ "$ZIP_SRC" != "$FINAL_ZIP" ]; then
              cp -f "$ZIP_SRC" "$FINAL_ZIP"
            fi
          fi

          echo "===== FINAL TWRP ZIP ====="
          ls -lh "$FINAL_ZIP"

          echo "===== ZIP CONTENT CHECK ====="
          unzip -l "$FINAL_ZIP" | tee twrp-zip-content.txt

          if ! unzip -l "$FINAL_ZIP" | grep -q "anykernel.sh"; then
            echo "ERROR: anykernel.sh missing from flashable zip."
            exit 1
          fi

          if ! unzip -l "$FINAL_ZIP" | grep -q "META-INF/com/google/android"; then
            echo "ERROR: META-INF/com/google/android missing. TWRP may not flash this zip."
            exit 1
          fi

          for f in boot.img vendor_boot.img dtbo.img; do
            if ! unzip -l "$FINAL_ZIP" | grep -q "$f"; then
              echo "ERROR: $f missing from TWRP zip."
              exit 1
            fi
          done

          echo "TWRP flashable clean v87 zip is ready: $FINAL_ZIP"

      - name: Verify outputs and show errors
        if: always()
        run: |
          echo "===== OUTPUT FILES ====="
          find build/out/o1s -type f | sort || true

          echo "===== IMPORTANT ARTIFACTS ====="
          ls -lh build/out/o1s/Image 2>/dev/null || true
          ls -lh build/out/o1s/boot.img 2>/dev/null || true
          ls -lh build/out/o1s/vendor_boot.img 2>/dev/null || true
          ls -lh build/out/o1s/dtb.img 2>/dev/null || true
          ls -lh build/out/o1s/dtbo.img 2>/dev/null || true
          ls -lh build/out/o1s/*.zip 2>/dev/null || true

          echo "===== UPTIME PATCH REPORT ====="
          cat uptime-patch-report.txt 2>/dev/null || true

          echo "===== TWRP ZIP CONTENT ====="
          cat twrp-zip-content.txt 2>/dev/null || true

          echo "===== ERROR LINES ====="
          grep -i -n "error:\|fatal error:\|undefined reference\|No such file\|ld.lld:\|FAILED\|abort\|SecurityException" build.log | head -250 || true

          echo "===== LAST 250 LINES ====="
          tail -250 build.log || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: o1s-ksun-susfs-twrp-uptime-clean-v87
          path: |
            build.log
            uptime-patch-report.txt
            twrp-zip-content.txt
            kernel/time/timekeeping.c
            fs/stat.c
            include/linux/ghost_uptime.h
            kernel/ghost_uptime.c
            kernel/Makefile
            build/out/o1s/Image
            build/out/o1s/*.img
            build/out/o1s/*.zip
            build/out/o1s/modules/**
          if-no-files-found: warn

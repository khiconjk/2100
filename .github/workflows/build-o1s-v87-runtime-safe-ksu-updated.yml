name: V87 Build o1s - Compatible KSU Modes

on:
  workflow_dispatch:
    inputs:
      device:
        description: "Device model passed to build.sh"
        required: true
        default: "o1s"
        type: choice
        options:
          - o1s
          - r9s
          - t2s
          - p3s
      build_mode:
        description: "pinned: repo KSU + SuSFS; updated: selected KSU without stale SuSFS patch"
        required: true
        default: "pinned-ksu-susfs"
        type: choice
        options:
          - pinned-ksu-susfs
          - updated-ksu
      ksu_ref:
        description: "KernelSU-Next tag/branch used only in updated-ksu mode"
        required: true
        default: "v3.2.0"
        type: string
      recovery:
        description: "Recovery build"
        required: true
        default: "N"
        type: choice
        options:
          - "N"
          - "y"

permissions:
  contents: read

concurrency:
  group: v87-${{ github.workflow }}-${{ inputs.device }}-${{ inputs.build_mode }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ inputs.device }} / ${{ inputs.build_mode }}
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      DEVICE: ${{ inputs.device }}
      BUILD_MODE: ${{ inputs.build_mode }}
      REQUESTED_KSU_REF: ${{ inputs.ksu_ref }}
      RECOVERY_OPTION: ${{ inputs.recovery }}
      KSU_REPO: "https://github.com/KernelSU-Next/KernelSU-Next.git"
      BUILD_LOG: "build.log"
      CI_FULL_LOG: "ci-full-run.log"
      SUMMARY_LOG: "build-summary.txt"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: false

      - name: Initialize build mode and required submodules
        shell: bash
        run: |
          set -euo pipefail
          : > "$CI_FULL_LOG"

          {
            echo "===== INITIALIZE ====="
            echo "Repository=$GITHUB_REPOSITORY"
            echo "Commit=$GITHUB_SHA"
            echo "Device=$DEVICE"
            echo "Build mode=$BUILD_MODE"
            echo "Requested KSU ref=$REQUESTED_KSU_REF"
            echo "Recovery=$RECOVERY_OPTION"
            echo

            git submodule sync -- toolchain/mkbootimg
            git submodule update --init --depth=1 toolchain/mkbootimg

            case "$BUILD_MODE" in
              pinned-ksu-susfs)
                echo "KSU_OPTION=y" >> "$GITHUB_ENV"
                echo "SUSFS_OPTION=y" >> "$GITHUB_ENV"
                echo "EFFECTIVE_KSU_REF=repo-pinned" >> "$GITHUB_ENV"

                git submodule sync -- KernelSU-Next
                git submodule update --init --depth=1 KernelSU-Next

                pinned_sha="$(git -C KernelSU-Next rev-parse HEAD)"
                echo "PINNED_KSU_SHA=$pinned_sha" >> "$GITHUB_ENV"
                echo "Using repository-pinned KernelSU: $pinned_sha"
                echo "SuSFS patch: enabled"
                ;;

              updated-ksu)
                echo "KSU_OPTION=y" >> "$GITHUB_ENV"
                echo "SUSFS_OPTION=n" >> "$GITHUB_ENV"
                echo "EFFECTIVE_KSU_REF=$REQUESTED_KSU_REF" >> "$GITHUB_ENV"

                echo "Using updated KernelSU ref: $REQUESTED_KSU_REF"
                echo "SuSFS patch: disabled because the repository patch is incompatible with v3.2.0-era KSU sources"
                ;;

              *)
                echo "ERROR: unsupported build mode: $BUILD_MODE"
                exit 1
                ;;
            esac

            git submodule status || true
          } 2>&1 | tee -a "$CI_FULL_LOG"

      - name: Cache clang r596125
        uses: actions/cache@v4
        with:
          path: toolchain/clang-r596125
          key: clang-r596125-${{ runner.os }}-v1

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "===== INSTALL DEPENDENCIES ====="
            sudo apt-get update
            sudo apt-get install -y \
              bc \
              bison \
              build-essential \
              cpio \
              flex \
              git \
              kmod \
              libelf-dev \
              libssl-dev \
              lld \
              llvm \
              patch \
              python3 \
              rsync \
              unzip \
              wget \
              xz-utils \
              zip \
              zstd
          } 2>&1 | tee -a "$CI_FULL_LOG"

      - name: Configure selected KernelSU source
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "===== CONFIGURE KERNELSU SOURCE ====="
            echo "Build mode=$BUILD_MODE"

            test -f build.sh

            if [[ "$BUILD_MODE" == "updated-ksu" ]]; then
              python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("build.sh")
          text = path.read_text()

          pattern = re.compile(
              r'fetch_ksu\(\)\s*\{.*?\n\}\s*(?=enable_susfs\(\))',
              re.S,
          )

          replacement = "\n".join([
              "fetch_ksu()",
              "{",
              '    rm -rf "$PWD/KernelSU-Next"',
              '    echo "Fetching selected KernelSU Next ref: $REQUESTED_KSU_REF"',
              '    git clone --depth=1 --branch "$REQUESTED_KSU_REF" "$KSU_REPO" KernelSU-Next || abort',
              "}",
              "",
              "",
          ])

          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(
                  f"ERROR: expected to replace one fetch_ksu() function, replaced {count}"
              )

          path.write_text(updated)
          PY

              bash -n build.sh

              grep -n 'fetch_ksu' -A12 -B2 build.sh | head -40
              grep -Fq 'git clone --depth=1 --branch "$REQUESTED_KSU_REF" "$KSU_REPO" KernelSU-Next' build.sh
            else
              echo "Keeping build.sh unchanged so it uses the repository-pinned KernelSU submodule."
              bash -n build.sh
            fi
          } 2>&1 | tee -a "$CI_FULL_LOG"

      - name: Preflight SuSFS compatibility
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "===== PREFLIGHT ====="
            echo "KSU_OPTION=$KSU_OPTION"
            echo "SUSFS_OPTION=$SUSFS_OPTION"
            echo "EFFECTIVE_KSU_REF=$EFFECTIVE_KSU_REF"

            if [[ "$SUSFS_OPTION" == "y" ]]; then
              test "$BUILD_MODE" = "pinned-ksu-susfs"
              test -f patches/enable-susfs.patch

              rm -rf KernelSU-Next
              git submodule update --init --depth=1 KernelSU-Next

              echo "Testing SuSFS patch against pinned KernelSU..."
              patch \
                --dry-run \
                --batch \
                --forward \
                -d "$PWD/KernelSU-Next" \
                -p1 \
                < "$PWD/patches/enable-susfs.patch"

              rm -rf KernelSU-Next
              echo "SuSFS dry-run passed."
            else
              echo "SuSFS compatibility test skipped."
            fi
          } 2>&1 | tee -a "$CI_FULL_LOG"

      - name: Build kernel
        shell: bash
        run: |
          set +e
          set -o pipefail

          echo "===== BUILD =====" | tee -a "$CI_FULL_LOG"
          echo "BUILD_START_UTC=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" | tee -a "$CI_FULL_LOG"
          echo "Device=$DEVICE" | tee -a "$CI_FULL_LOG"
          echo "Build mode=$BUILD_MODE" | tee -a "$CI_FULL_LOG"
          echo "KSU_OPTION=$KSU_OPTION" | tee -a "$CI_FULL_LOG"
          echo "SUSFS_OPTION=$SUSFS_OPTION" | tee -a "$CI_FULL_LOG"
          echo "EFFECTIVE_KSU_REF=$EFFECTIVE_KSU_REF" | tee -a "$CI_FULL_LOG"
          echo "RECOVERY_OPTION=$RECOVERY_OPTION" | tee -a "$CI_FULL_LOG"

          chmod +x build.sh

          ./build.sh \
            --model "$DEVICE" \
            --ksu "$KSU_OPTION" \
            --susfs "$SUSFS_OPTION" \
            --recovery "$RECOVERY_OPTION" \
            2>&1 | tee "$BUILD_LOG" | tee -a "$CI_FULL_LOG"

          build_code=${PIPESTATUS[0]}

          echo "BUILD_EXIT_CODE=$build_code" | tee -a "$CI_FULL_LOG"
          echo "BUILD_END_UTC=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" | tee -a "$CI_FULL_LOG"

          exit "$build_code"

      - name: Collect diagnostics and outputs
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p upload-artifacts/rejects upload-artifacts/output

          {
            echo "===== BUILD SUMMARY ====="
            echo "Repository=$GITHUB_REPOSITORY"
            echo "Commit=$GITHUB_SHA"
            echo "Device=$DEVICE"
            echo "Build mode=$BUILD_MODE"
            echo "KSU_OPTION=${KSU_OPTION:-unknown}"
            echo "SUSFS_OPTION=${SUSFS_OPTION:-unknown}"
            echo "EFFECTIVE_KSU_REF=${EFFECTIVE_KSU_REF:-unknown}"
            echo "Recovery=$RECOVERY_OPTION"
            echo

            echo "===== KERNELSU VERSION ====="
            if git -C KernelSU-Next rev-parse --is-inside-work-tree >/dev/null 2>&1; then
              echo "KSU_REMOTE=$(git -C KernelSU-Next remote get-url origin 2>/dev/null || true)"
              echo "KSU_HEAD=$(git -C KernelSU-Next rev-parse HEAD)"
              echo "KSU_DESCRIBE=$(git -C KernelSU-Next describe --tags --always --dirty 2>/dev/null || true)"
              git -C KernelSU-Next log -1 --oneline || true
            else
              echo "KernelSU-Next checkout unavailable."
            fi
            echo

            echo "===== ERROR AND PATCH MARKERS ====="
            grep -RIn \
              -e "fatal error:" \
              -e " error:" \
              -e "undefined reference" \
              -e "No rule to make target" \
              -e "No such file" \
              -e "FAILED at" \
              -e "FAILED --" \
              -e "saving rejects" \
              -e "Kernel compilation failed" \
              -e "BUILD_EXIT_CODE=" \
              -e "ERROR:" \
              "$BUILD_LOG" "$CI_FULL_LOG" 2>/dev/null \
              | head -1000 || true
            echo

            echo "===== OUTPUT FILES ====="
            find . \
              \( -name "*.img" -o -name "*.zip" -o -name "Image" -o -name "Image.gz" -o -name "vendor_boot.img" -o -name "boot.img" -o -name "dtbo.img" -o -name "dtb.img" \) \
              -type f -printf "%p %s bytes\n" 2>/dev/null | sort
            echo

            echo "===== BUILD LAST 800 LINES ====="
            tail -800 "$BUILD_LOG" 2>/dev/null || true
          } > "$SUMMARY_LOG"

          find . -type f \( -name "*.rej" -o -name "*.orig" \) \
            -exec cp --parents -f "{}" upload-artifacts/rejects/ \; 2>/dev/null || true

          find . \
            \( -name "*.img" -o -name "*.zip" -o -name "Image" -o -name "Image.gz" -o -name "vendor_boot.img" -o -name "boot.img" -o -name "dtbo.img" -o -name "dtb.img" \) \
            -type f -exec cp -f "{}" upload-artifacts/output/ \; 2>/dev/null || true

          cp -f "$BUILD_LOG" upload-artifacts/ 2>/dev/null || true
          cp -f "$CI_FULL_LOG" upload-artifacts/ 2>/dev/null || true
          cp -f "$SUMMARY_LOG" upload-artifacts/ 2>/dev/null || true
          cp -f out/.config upload-artifacts/kernel-config.txt 2>/dev/null || true

          cat "$SUMMARY_LOG"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v87-${{ inputs.device }}-${{ inputs.build_mode }}-${{ github.run_number }}
          path: upload-artifacts/**
          if-no-files-found: warn
          retention-days: 14

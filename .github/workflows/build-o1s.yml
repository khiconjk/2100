name: Build o1s Ghost Full

# Builds every in-tree Ghost kernel patch for Galaxy S21 (o1s) and packs
# flashable VANILLA + KSUN+SuSFS artifacts (boot/vendor_boot/dtbo, TWRP zip,
# ODIN tar.md5, ODIN LZ4 tar.md5, disabled vbmeta).
#
# Local usage: Actions > Build o1s Ghost Full > Run workflow.
# Variants: all | vanilla | ksun-susfs

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Kernel variant to build
        required: true
        default: all
        type: choice
        options:
          - all
          - vanilla
          - ksun-susfs
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "build.sh"
      - "build_kernel.sh"
      - "package_all.sh"
      - "run_full_build_v14.sh"
      - "Makefile"
      - "Kconfig"
      - "ghost.conf"
      - "patches/**"
      - "arch/**"
      - "block/**"
      - "certs/**"
      - "crypto/**"
      - "drivers/**"
      - "fs/**"
      - "include/**"
      - "init/**"
      - "ipc/**"
      - "kernel/**"
      - "lib/**"
      - "mm/**"
      - "net/**"
      - "security/**"
      - "sound/**"
      - "virt/**"
      - "dt.configs/**"
      - "build/ramdisk/**"
      - "scripts/**"
      - "tests/**"

concurrency:
  group: o1s-kernel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  select:
    name: Select variants
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.select.outputs.include }}
    steps:
      - id: select
        name: Build matrix JSON
        env:
          EVENT_NAME: ${{ github.event_name }}
          VARIANT: ${{ github.event.inputs.variant }}
        run: |
          set -euo pipefail
          vanilla='{"variant":"vanilla","ksu":"n","susfs":"n","label":"VANILLA_GHOST_FULL"}'
          ksun='{"variant":"ksun-susfs","ksu":"y","susfs":"y","label":"KSUN_SUSFS_GHOST_FULL"}'
          if [ "$EVENT_NAME" != "workflow_dispatch" ] || [ -z "$VARIANT" ] || [ "$VARIANT" = "all" ]; then
            include="[$vanilla,$ksun]"
          elif [ "$VARIANT" = "vanilla" ]; then
            include="[$vanilla]"
          elif [ "$VARIANT" = "ksun-susfs" ]; then
            include="[$ksun]"
          else
            echo "Unknown variant: $VARIANT"
            exit 1
          fi
          {
            echo "include<<EOF"
            echo "$include"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Selected matrix: $include"

  build:
    name: o1s ${{ matrix.variant }}
    needs: select
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.include) }}

    env:
      MODEL: o1s
      VARIANT: ${{ matrix.variant }}
      KSU_OPTION: ${{ matrix.ksu }}
      SUSFS_OPTION: ${{ matrix.susfs }}
      LABEL: ${{ matrix.label }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: false

      - name: Free disk space
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache
          sudo apt-get clean
          df -h

      - name: Install dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            git curl wget tar xz-utils zip unzip \
            build-essential bc bison flex \
            libssl-dev libelf-dev dwarves pahole \
            python3 python3-pip python3-yaml \
            cpio lz4 gzip kmod rsync ca-certificates patch

      - name: Verify Ghost patch sources
        run: |
          set -euxo pipefail
          echo "===== GHOST PATCH SOURCE CHECK ====="
          test -f include/linux/ghost_procfs.h
          test -f include/linux/ghost_config.h
          test -f include/linux/ghost_uptime.h
          test -f include/linux/ghost_bytebench.h
          test -f kernel/ghost_config.c
          test -f kernel/ghost_uptime.c
          test -f kernel/ghost_bytebench.c
          test -f ghost.conf
          test -f patches/enable-susfs.patch
          test -f arch/arm64/configs/o1s.config
          test -f arch/arm64/configs/ksu.config
          test -f arch/arm64/configs/susfs.config
          test -f arch/arm64/configs/nosusfs.config
          grep -q 'exynos_chipid_sync_ghost' drivers/soc/samsung/exynos-chipid_v2.c
          grep -q 'androidboot.boot_hash=7207368a4caca12d62f0382e67932c38f78c6d0b3f9bd7f5967825461b4172c1' build.sh
          grep -q 'androidboot.verifiedbootkey=22defff599279ee456bbae21e65c2623cf87660f8eb8cb50d91d5879d703a781' build.sh
          echo "Ghost kernel sources and locked boot_hash/boot_key are present."

      - name: Run safety and packaging tests
        run: |
          set -euxo pipefail
          echo "===== RUN BUILD SAFETY TESTS ====="
          chmod +x tests/test_b02_modules.sh tests/test_b03_packaging.sh
          bash tests/test_b02_modules.sh
          bash tests/test_b03_packaging.sh
          python3 tests/validate_ci.py

      - name: Hard clean old build outputs
        run: |
          set -euxo pipefail
          echo "===== CLEAN OLD BUILD OUTPUTS ====="
          rm -rf out build/out AnyKernel3
          rm -f build.log Module.symvers modules.order .scmversion
          # GNU find: -delete implies -depth and cannot be combined with -prune.
          find . \
            ! -path './.git/*' ! -path './toolchain/*' ! -path './clang/*' ! -path './KernelSU-Next/*' \
            \( -name '*.o' -o -name '*.mod' -o -name '*.mod.c' -o -name '.*.cmd' -o -name '*.a' -o -name '.tmp_*' \) \
            -type f -delete
          df -h
          ls -la

      - name: Prepare image tools
        run: |
          set -euxo pipefail
          echo "===== PREPARE TOOLS ====="
          rm -rf clang toolchain/mkbootimg toolchain/libufdt toolchain/avb
          rm -f toolchain/mkdtimg
          mkdir -p toolchain

          git clone --depth=1 https://android.googlesource.com/platform/system/tools/mkbootimg toolchain/mkbootimg
          git clone --depth=1 https://android.googlesource.com/platform/system/libufdt toolchain/libufdt
          git clone --depth=1 https://android.googlesource.com/platform/external/avb toolchain/avb

          if [ -f toolchain/libufdt/utils/src/mkdtboimg.py ]; then
            cp -f toolchain/libufdt/utils/src/mkdtboimg.py toolchain/mkdtimg
          elif [ -f toolchain/libufdt/utils/mkdtboimg.py ]; then
            cp -f toolchain/libufdt/utils/mkdtboimg.py toolchain/mkdtimg
          elif [ -f toolchain/libufdt/utils/src/mkdtimg.py ]; then
            cp -f toolchain/libufdt/utils/src/mkdtimg.py toolchain/mkdtimg
          elif [ -f toolchain/libufdt/utils/mkdtimg.py ]; then
            cp -f toolchain/libufdt/utils/mkdtimg.py toolchain/mkdtimg
          else
            echo "ERROR: mkdtimg/mkdtboimg script not found"
            exit 1
          fi
          chmod +x toolchain/mkdtimg
          test -f toolchain/avb/avbtool.py
          ls -l toolchain/mkdtimg toolchain/avb/avbtool.py
          ls -la toolchain/mkbootimg | head || true

      - name: Prepare KernelSU-Next
        if: matrix.ksu == 'y'
        run: |
          set -euxo pipefail
          echo "===== PREPARE KERNELSU-NEXT ====="
          if [ ! -f "KernelSU-Next/kernel/Kconfig" ] || [ ! -d "KernelSU-Next/.git" ]; then
            rm -rf KernelSU-Next
            git clone https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU-Next
            (
              cd KernelSU-Next
              git checkout c49a6316c556f84b8e21ef3af3e1b49032b47ea0
            )
          fi
          (
            cd KernelSU-Next
            echo "KSU Commit: $(git rev-parse HEAD)"
            echo "KSU Tag: $(git describe --tags --abbrev=0 2>/dev/null || echo 'none')"
            echo "KSU Revision Count: $(git rev-list --count HEAD 2>/dev/null || echo 'none')"
          )

      - name: Cache clang
        uses: actions/cache@v5
        with:
          path: toolchain/clang-r596125
          key: clang-r596125-linux-x86-stable-v2

      - name: Setup clang
        run: |
          set -euxo pipefail
          echo "===== SETUP CLANG ====="
          if [ ! -x toolchain/clang-r596125/bin/clang ]; then
            echo "Clang not found, downloading..."
            rm -rf toolchain/clang-r596125
            rm -f toolchain/clang.tar.gz
            mkdir -p toolchain/clang-r596125
            wget -O toolchain/clang.tar.gz \
              "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/mirror-goog-main-llvm-toolchain-source/clang-r596125.tar.gz"
            tar -xf toolchain/clang.tar.gz -C toolchain/clang-r596125
            rm -f toolchain/clang.tar.gz
          fi
          toolchain/clang-r596125/bin/clang --version

      - name: Verify vibrator is clean
        run: |
          set -euo pipefail
          echo "===== CHECK VIBRATOR PATCH TRACE ====="
          if grep -RniE "GHOST_DISABLE_VIBRATOR|DISABLE VIBRATOR|force motor OFF|haptic packet blocked|haptic enable blocked|block all enable requests" \
            drivers/vibrator build.sh 2>/dev/null; then
            echo "ERROR: vibrator no-op trace still exists"
            exit 1
          fi
          echo "===== CHECK VIBRATOR SOURCE ====="
          grep -RniE "vib_ops->enable|max77705_vibrator_i2c_enable|max77705_vibrator_enable|max77705_update_reg|MOTOR_EN|pwm_enable|CONFIG_MAX77705_VIBRATOR" \
            drivers/vibrator arch/arm64/configs/o1s.config 2>/dev/null || true
          echo "Vibrator source looks clean."

      - name: Patch build.sh safety fixes
        run: |
          set -euxo pipefail
          echo "===== PATCH BUILD.SH SAFETY FIXES ====="
          chmod +x build.sh
          sed -i 's#refs/heads/master/clang-r596125.tar.gz#refs/heads/mirror-goog-main-llvm-toolchain-source/clang-r596125.tar.gz#g' build.sh || true
          sed -i 's#> ../$MODEl/vendor_ramdisk#> ../vendor_ramdisk#g' build.sh || true
          sed -i 's#> ../\$MODEl/vendor_ramdisk#> ../vendor_ramdisk#g' build.sh || true
          sed -i 's#git submodule update --init --force --depth=1 --recursive#echo "skip recursive submodules in CI"#g' build.sh || true
          python3 - <<'PY'
          from pathlib import Path
          path = Path("build.sh")
          text = path.read_text(encoding="utf-8")
          old = 'find . -name "*.a" -delete || true'
          new = 'find . -name "*.a" ! -path "./toolchain/*" ! -path "./clang/*" ! -path "./.git/*" ! -path "./KernelSU-Next/*" -type f -delete || true'
          if old not in text:
              raise SystemExit("build.sh clang-safe *.a clean pattern not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          echo "===== VERIFY BUILD.SH PATCH ====="
          grep -n "clang-r596125\|vendor_ramdisk\|MODEl\|submodule\|name \"\*.a\"" build.sh || true

      - name: Final clean before build
        run: |
          set -euxo pipefail
          echo "===== FINAL CLEAN BEFORE BUILD ====="
          rm -rf out build/out
          rm -f build.log
          find . \
            ! -path './.git/*' ! -path './toolchain/*' ! -path './clang/*' ! -path './KernelSU-Next/*' \
            \( -name '*.o' -o -name '*.mod' -o -name '*.mod.c' -o -name '.*.cmd' -o -name '.tmp_*' \) \
            -type f -delete
          mkdir -p build/out
          echo "Clean done."

      - name: Build kernel
        run: |
          set -euxo pipefail
          echo "===== BUILD o1s ${VARIANT} KERNEL ====="
          echo "build.sh -m ${MODEL} -k ${KSU_OPTION} -s ${SUSFS_OPTION} -r n"
          bash build.sh -m "${MODEL}" -k "${KSU_OPTION}" -s "${SUSFS_OPTION}" -r n 2>&1 | tee build.log

      - name: Pack ODIN + TWRP + vbmeta
        run: |
          set -euxo pipefail
          OUT="build/out/${MODEL}"
          test -f "${OUT}/boot.img"
          test -f "${OUT}/vendor_boot.img"
          test -f "${OUT}/dtbo.img"

          echo "===== CREATE DISABLED VBMETA ====="
          python3 toolchain/avb/avbtool.py make_vbmeta_image \
            --flags 2 \
            --padding_size 4096 \
            --output "${OUT}/vbmeta.img"
          python3 toolchain/avb/avbtool.py make_vbmeta_image \
            --flags 2 \
            --padding_size 4096 \
            --output "${OUT}/vbmeta_system.img"
          python3 toolchain/avb/avbtool.py info_image --image "${OUT}/vbmeta.img" || true

          echo "===== UPDATE TWRP ZIP WITH VBMETA ====="
          mapfile -t ZIPS < <(find "${OUT}" -maxdepth 1 -type f -name '*.zip' | sort)
          if [ "${#ZIPS[@]}" -eq 0 ]; then
            echo "ERROR: AnyKernel/TWRP zip missing"
            exit 1
          fi
          for zip_path in "${ZIPS[@]}"; do
            zip -j -u "${zip_path}" "${OUT}/vbmeta.img" "${OUT}/vbmeta_system.img"
          done
          cp -f "${ZIPS[0]}" "${OUT}/G991B_${LABEL}_TWRP.zip"

          echo "===== PACK ODIN tar.md5 ====="
          STAGE="${OUT}/odin-stage"
          rm -rf "${STAGE}"
          mkdir -p "${STAGE}"
          cp -f "${OUT}/boot.img" "${OUT}/vendor_boot.img" "${OUT}/dtbo.img" \
                "${OUT}/vbmeta.img" "${OUT}/vbmeta_system.img" "${STAGE}/"

          pack_tar_md5() {
            local tar_name="$1"
            shift
            local tar_path="${OUT}/${tar_name}"
            tar --format=ustar -C "${STAGE}" -cf "${tar_path}" "$@"
            (cd "${OUT}" && md5sum "${tar_name}" >> "${tar_name}")
            mv "${tar_path}" "${tar_path}.md5"
          }

          pack_tar_md5 "G991B_${LABEL}_ODIN.tar" \
            boot.img vendor_boot.img dtbo.img vbmeta.img vbmeta_system.img

          echo "===== PACK ODIN LZ4 tar.md5 ====="
          lz4 -B6 --content-size -f "${STAGE}/boot.img" "${STAGE}/boot.img.lz4"
          lz4 -B6 --content-size -f "${STAGE}/vendor_boot.img" "${STAGE}/vendor_boot.img.lz4"
          lz4 -B6 --content-size -f "${STAGE}/dtbo.img" "${STAGE}/dtbo.img.lz4"
          lz4 -B6 --content-size -f "${STAGE}/vbmeta.img" "${STAGE}/vbmeta.img.lz4"
          lz4 -B6 --content-size -f "${STAGE}/vbmeta_system.img" "${STAGE}/vbmeta_system.img.lz4"
          pack_tar_md5 "G991B_${LABEL}_ODIN_LZ4.tar" \
            boot.img.lz4 vendor_boot.img.lz4 dtbo.img.lz4 vbmeta.img.lz4 vbmeta_system.img.lz4

          echo "===== SHA256 ====="
          (
            cd "${OUT}"
            files=(
              Image boot.img vendor_boot.img dtbo.img
              vbmeta.img vbmeta_system.img
              "G991B_${LABEL}_TWRP.zip"
              "G991B_${LABEL}_ODIN.tar.md5"
              "G991B_${LABEL}_ODIN_LZ4.tar.md5"
            )
            [ -f dtb.img ] && files+=(dtb.img)
            shopt -s nullglob
            files+=(./*.zip)
            sha256sum "${files[@]}" | sort -u > SHA256SUMS.txt
            cat SHA256SUMS.txt
            {
              echo "## o1s ${VARIANT} artifacts"
              echo
              echo '```'
              cat SHA256SUMS.txt
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
          )
          rm -rf "${STAGE}"

      - name: Verify fresh outputs
        if: always()
        run: |
          set +e
          echo "===== OUTPUT FILES ====="
          find build/out/o1s -maxdepth 2 -type f | sort || true
          echo "===== IMPORTANT ARTIFACTS ====="
          ls -lh build/out/o1s/Image build/out/o1s/*.img build/out/o1s/*.zip build/out/o1s/*.tar.md5 2>/dev/null || true
          echo "===== ERROR LINES ====="
          grep -i -n "error:\|fatal error:\|undefined reference\|No such file\|ld.lld:\|FAILED\|abort\|SecurityException" build.log | head -250 || true
          echo "===== LAST 250 LINES ====="
          tail -250 build.log || true

      - name: Fail if required flash files missing
        run: |
          set -euxo pipefail
          test -f build/out/o1s/vendor_boot.img
          test -f build/out/o1s/boot.img
          test -f build/out/o1s/dtbo.img
          test -f "build/out/o1s/G991B_${LABEL}_TWRP.zip"
          test -f "build/out/o1s/G991B_${LABEL}_ODIN.tar.md5"
          test -f "build/out/o1s/G991B_${LABEL}_ODIN_LZ4.tar.md5"

      - name: Prune old artifacts
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          CURRENT_RUN: ${{ github.run_id }}
        run: |
          set +e
          echo "===== PRUNING OLD ARTIFACTS IF STORAGE IS TIGHT ====="
          if command -v gh >/dev/null 2>&1; then
            gh api "repos/${REPO}/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.workflow_run.id != '"${CURRENT_RUN}"') | .id' 2>/dev/null | while read -r art_id; do
              if [ -n "${art_id}" ]; then
                echo "Pruning older artifact ID: ${art_id}"
                gh api -X DELETE "repos/${REPO}/actions/artifacts/${art_id}" >/dev/null 2>&1 || true
              fi
            done
          fi
          echo "Prune step finished."

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v5
        continue-on-error: true
        with:
          name: o1s-${{ matrix.variant }}-ghost-full
          if-no-files-found: warn
          retention-days: 2
          path: |
            build.log
            build/out/o1s/SHA256SUMS.txt
            build/out/o1s/Image
            build/out/o1s/*.img
            build/out/o1s/*.zip
            build/out/o1s/*.tar.md5

      - name: Publish to GitHub Releases
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euxo pipefail
          echo "===== PUBLISH TO GITHUB RELEASES ====="
          RELEASE_TAG="o1s-${VARIANT}-ghost-full"
          RELEASE_TITLE="Galaxy S21 (SM-G991B) - ${LABEL}"
          OUT="build/out/${MODEL}"

          gh release view "${RELEASE_TAG}" --repo "${REPO}" >/dev/null 2>&1 || \
            gh release create "${RELEASE_TAG}" \
              --repo "${REPO}" \
              --title "${RELEASE_TITLE}" \
              --notes "Automated build of Ghost Kernel for Samsung Galaxy S21 (SM-G991B / o1s), variant ${VARIANT}." \
              --prerelease=false || true

          mapfile -t FILES < <(find "${OUT}" -maxdepth 1 -type f \( -name '*.img' -o -name '*.zip' -o -name '*.tar.md5' -o -name 'SHA256SUMS.txt' \) | sort)
          if [ "${#FILES[@]}" -gt 0 ]; then
            gh release upload "${RELEASE_TAG}" "${FILES[@]}" build.log --clobber --repo "${REPO}" || true
          fi

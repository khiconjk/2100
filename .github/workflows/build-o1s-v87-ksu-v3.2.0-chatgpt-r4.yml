name: V87 o1s - KernelSU Next v3.2.0 + SuSFS - ChatGPT Logs
on:
  workflow_dispatch:
    inputs:
      device:
        description: "Device model"
        required: true
        default: "o1s"
        type: choice
        options:
          - o1s
          - r9s
          - t2s
          - p3s
      recovery:
        description: "Build for Android Recovery"
        required: true
        default: "N"
        type: choice
        options:
          - "N"
          - "y"
permissions:
  contents: read
concurrency:
  group: v87-ksu-v3.2.0-susfs-${{ inputs.device }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: ${{ inputs.device }} / KSU v3.2.0 / SuSFS on
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      DEVICE: ${{ inputs.device }}
      RECOVERY_OPTION: ${{ inputs.recovery }}
      KSU_REPO: https://github.com/KernelSU-Next/KernelSU-Next.git
      KSU_REF: v3.2.0
      KSU_EXPECTED_SHA: 551ad80473f60e052917aec08abf5323b6ab2f7c
      KSU_OPTION: "y"
      SUSFS_OPTION: "y"
      CLANG_DIR: toolchain/clang-r596125
      BUILD_LOG: build-full.log
      BUILD_EXIT_FILE: build-exit-code.txt
      CHATGPT_LOG: chatgpt-readable-build-log.txt
      ERROR_CONTEXT_LOG: chatgpt-error-context.txt
      METADATA_JSON: build-metadata.json
      ARTIFACT_DIR: chatgpt-build-artifact
      SUSFS_PREFLIGHT_LOG: susfs-preflight.log
      SUSFS_PREFLIGHT_EXIT_FILE: susfs-preflight-exit-code.txt
      SUSFS_REJECT_DIR: susfs-patch-rejects
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false
      - name: Initialize required mkbootimg submodule
        shell: bash
        run: |
          set -euo pipefail
          git submodule sync -- toolchain/mkbootimg
          git submodule update --init --depth=1 toolchain/mkbootimg
          git -C toolchain/mkbootimg rev-parse HEAD
      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            bc \
            bison \
            build-essential \
            cpio \
            flex \
            git \
            kmod \
            libelf-dev \
            libssl-dev \
            lld \
            llvm \
            patch \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils \
            zip \
            zstd
      - name: Restore clang cache
        uses: actions/cache@v4
        with:
          path: toolchain/clang-r596125
          key: clang-r596125-${{ runner.os }}-v2
      - name: Prepare clang quietly
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -x "$CLANG_DIR/bin/clang" ]]; then
            echo "Downloading clang r596125 without verbose progress output..."
            rm -rf "$CLANG_DIR"
            mkdir -p "$CLANG_DIR"
            wget -q \
              -O /tmp/clang-r596125.tar.gz \
              "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/mirror-goog-main-llvm-toolchain-source/clang-r596125.tar.gz"
            tar -xzf /tmp/clang-r596125.tar.gz -C "$CLANG_DIR"
            rm -f /tmp/clang-r596125.tar.gz
          else
            echo "Using cached clang r596125."
          fi
          "$CLANG_DIR/bin/clang" --version | head -n 2
          test -x "$CLANG_DIR/bin/ld.lld"

      - name: Disable fetch_ksu() and enable_susfs() in build.sh
        shell: bash
        run: |
          set -euo pipefail
          echo "Patching build.sh to use pre-prepared sources..."
          sed -i '/^fetch_ksu()/,/^}/c\fetch_ksu()\n{\n    echo "Using pre-cloned KernelSU-Next"\n}' build.sh
          sed -i '/^enable_susfs()/,/^}/c\enable_susfs()\n{\n    echo "SuSFS already applied"\n}' build.sh
          chmod +x build.sh
          bash -n build.sh
          echo "build.sh patched successfully."

      - name: Prepare KernelSU-Next v3.2.0 and apply SuSFS patch
        shell: bash
        run: |
          set -euo pipefail
          echo "Fetching exact KernelSU Next $KSU_REF..."
          rm -rf KernelSU-Next
          git clone --depth=1 --branch "$KSU_REF" "$KSU_REPO" KernelSU-Next
          
          actual_sha="$(git -C KernelSU-Next rev-parse HEAD)"
          echo "KSU expected SHA: $KSU_EXPECTED_SHA"
          echo "KSU actual SHA: $actual_sha"
          
          if [[ "$actual_sha" != "$KSU_EXPECTED_SHA" ]]; then
            echo "ERROR: KernelSU SHA mismatch!"
            exit 1
          fi
          
          echo "Applying SuSFS patch to KernelSU-Next (allowing fuzz=3)..."
          mkdir -p "$SUSFS_REJECT_DIR"
          cd KernelSU-Next
          patch -p1 --fuzz=3 --forward < ../patches/enable-susfs.patch || true
          cd ..
          
          echo "Collecting reject files if any..."
          find KernelSU-Next -type f \( -name '*.rej' -o -name '*.orig' \) -print | while read -r f; do
            mkdir -p "$SUSFS_REJECT_DIR/$(dirname "$f")"
            cp -f "$f" "$SUSFS_REJECT_DIR/$f"
          done

      - name: Strict preflight of repository SuSFS patch
        id: susfs_preflight
        continue-on-error: true
        shell: bash
        run: |
          set +e
          set -o pipefail
          rm -rf /tmp/KernelSU-Next-v3.2.0-susfs-test
          git clone --quiet --depth=1 --branch "$KSU_REF" "$KSU_REPO" /tmp/KernelSU-Next-v3.2.0-susfs-test
          actual_sha="$(git -C /tmp/KernelSU-Next-v3.2.0-susfs-test rev-parse HEAD)"
          {
            echo "===== SUSFS STRICT PREFLIGHT ====="
            echo "KSU_REF=$KSU_REF"
            echo "KSU_EXPECTED_SHA=$KSU_EXPECTED_SHA"
            echo "KSU_ACTUAL_SHA=$actual_sha"
            echo "SUSFS_OPTION=$SUSFS_OPTION"
            echo "SUSFS_PATCH=$GITHUB_WORKSPACE/patches/enable-susfs.patch"
            echo "PATCH_POLICY=batch, forward-only, fuzz=3"
            echo
          } | tee "$SUSFS_PREFLIGHT_LOG"
          if [[ "$actual_sha" != "$KSU_EXPECTED_SHA" ]]; then
            echo "ERROR: KSU SHA mismatch before SuSFS preflight." | tee -a "$SUSFS_PREFLIGHT_LOG"
            printf '2\n' > "$SUSFS_PREFLIGHT_EXIT_FILE"
            exit 2
          fi
          if [[ ! -s patches/enable-susfs.patch ]]; then
            echo "ERROR: patches/enable-susfs.patch is missing or empty." | tee -a "$SUSFS_PREFLIGHT_LOG"
            printf '3\n' > "$SUSFS_PREFLIGHT_EXIT_FILE"
            exit 3
          fi
          patch --dry-run --batch --forward --fuzz=3 -d /tmp/KernelSU-Next-v3.2.0-susfs-test -p1 < patches/enable-susfs.patch 2>&1 | tee -a "$SUSFS_PREFLIGHT_LOG"
          preflight_status=${PIPESTATUS[0]}
          printf '%s\n' "$preflight_status" > "$SUSFS_PREFLIGHT_EXIT_FILE"
          if [[ "$preflight_status" -ne 0 ]]; then
            echo "SUSFS_PREFLIGHT_RESULT=FAILED" | tee -a "$SUSFS_PREFLIGHT_LOG"
            echo "SUSFS preflight failed; build will proceed (continue-on-error)." | tee -a "$SUSFS_PREFLIGHT_LOG"
            exit 0
          fi
          echo "SUSFS_PREFLIGHT_RESULT=PASSED" | tee -a "$SUSFS_PREFLIGHT_LOG"
          rm -rf /tmp/KernelSU-Next-v3.2.0-susfs-test

      - name: Build kernel with KSU v3.2.0
        id: kernel_build
        shell: bash
        run: |
          set +e
          set -o pipefail
          {
            echo "===== BUILD INVOCATION ====="
            echo "Repository=$GITHUB_REPOSITORY"
            echo "RepositoryCommit=$GITHUB_SHA"
            echo "RunId=$GITHUB_RUN_ID"
            echo "Device=$DEVICE"
            echo "KSU_REF=$KSU_REF"
            echo "KSU_EXPECTED_SHA=$KSU_EXPECTED_SHA"
            echo "KSU_OPTION=$KSU_OPTION"
            echo "SUSFS_OPTION=$SUSFS_OPTION"
            echo "Recovery=$RECOVERY_OPTION"
            echo "StartUTC=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
          } | tee "$BUILD_LOG"
          ./build.sh \
            --model "$DEVICE" \
            --ksu "$KSU_OPTION" \
            --susfs "$SUSFS_OPTION" \
            --recovery "$RECOVERY_OPTION" \
            2>&1 | tee -a "$BUILD_LOG"
          build_status=${PIPESTATUS[0]}
          {
            echo
            echo "BUILD_EXIT_CODE=$build_status"
            echo "EndUTC=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } | tee -a "$BUILD_LOG"
          printf '%s\n' "$build_status" > "$BUILD_EXIT_FILE"
          exit "$build_status"
      - name: Generate ChatGPT-readable diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p "$ARTIFACT_DIR/output"
          build_status="unknown"
          if [[ -f "$BUILD_EXIT_FILE" ]]; then
            build_status="$(tr -d '[:space:]' < "$BUILD_EXIT_FILE")"
          fi
          susfs_preflight_status="unknown"
          if [[ -f "$SUSFS_PREFLIGHT_EXIT_FILE" ]]; then
            susfs_preflight_status="$(tr -d '[:space:]' < "$SUSFS_PREFLIGHT_EXIT_FILE")"
          fi
          first_error_line="$(
            grep -nEm1 \
            'fatal error:|(^|[[:space:]])error:|ld\.lld: error:|undefined reference|No rule to make target|FAILED|Kernel compilation failed|Traceback|Exception|ERROR:' \
            "$BUILD_LOG" 2>/dev/null \
            | cut -d: -f1
          )"
          if [[ -n "$first_error_line" ]]; then
            context_start=$((first_error_line - 80))
            context_end=$((first_error_line + 220))
            (( context_start < 1 )) && context_start=1
            {
              echo "First meaningful error found at build log line: $first_error_line"
              echo "Showing lines $context_start through $context_end"
              echo
              sed -n "${context_start},${context_end}p" "$BUILD_LOG"
            } > "$ERROR_CONTEXT_LOG"
          else
            {
              echo "No compiler, linker, patch, script, or explicit build error marker was found."
              echo "BUILD_EXIT_CODE=$build_status"
            } > "$ERROR_CONTEXT_LOG"
          fi
          python3 <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          def git_output(path, *args):
            try:
              return subprocess.check_output(
                ["git", "-C", str(path), *args],
                text=True,
                stderr=subprocess.DEVNULL,
              ).strip()
            except Exception:
              return None
          def sha256(path):
            digest = hashlib.sha256()
            with path.open("rb") as handle:
              for block in iter(lambda: handle.read(1024 * 1024), b""):
                digest.update(block)
            return digest.hexdigest()
          root = Path(".")
          exit_file = root / os.environ["BUILD_EXIT_FILE"]
          build_exit_code = (
            exit_file.read_text().strip() if exit_file.exists() else "unknown"
          )
          output_patterns = {
            "Image",
            "Image.gz",
            "boot.img",
            "vendor_boot.img",
            "dtb.img",
            "dtbo.img",
          }
          outputs = []
          for path in root.rglob("*"):
            if not path.is_file():
              continue
            if path.name in output_patterns or path.suffix == ".zip":
              if any(part == ".git" for part in path.parts):
                continue
              outputs.append(
                {
                  "path": str(path),
                  "bytes": path.stat().st_size,
                  "sha256": sha256(path),
                }
              )
          metadata = {
            "schema": "chatgpt-kernel-build-report-v1",
            "repository": os.environ.get("GITHUB_REPOSITORY"),
            "repository_commit": os.environ.get("GITHUB_SHA"),
            "workflow": os.environ.get("GITHUB_WORKFLOW"),
            "run_id": os.environ.get("GITHUB_RUN_ID"),
            "run_number": os.environ.get("GITHUB_RUN_NUMBER"),
            "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
            "device": os.environ.get("DEVICE"),
            "recovery": os.environ.get("RECOVERY_OPTION"),
            "build_exit_code": build_exit_code,
            "kernel_su": {
              "repository": os.environ.get("KSU_REPO"),
              "requested_ref": os.environ.get("KSU_REF"),
              "expected_sha": os.environ.get("KSU_EXPECTED_SHA"),
              "actual_sha": git_output("KernelSU-Next", "rev-parse", "HEAD"),
              "actual_describe": git_output(
                "KernelSU-Next", "describe", "--tags", "--always", "--dirty"
              ),
              "actual_subject": git_output(
                "KernelSU-Next", "log", "-1", "--format=%s"
              ),
              "enabled": os.environ.get("KSU_OPTION") == "y",
            },
            "susfs": {
              "enabled": os.environ.get("SUSFS_OPTION") == "y",
              "patch_source": "patches/enable-susfs.patch",
              "preflight_exit_code": (
                Path(os.environ["SUSFS_PREFLIGHT_EXIT_FILE"]).read_text().strip()
                if Path(os.environ["SUSFS_PREFLIGHT_EXIT_FILE"]).exists()
                else "unknown"
              ),
              "reason": "Enabled for strict compatibility testing against KernelSU-Next v3.2.0.",
            },
            "outputs": sorted(outputs, key=lambda item: item["path"]),
          }
          Path(os.environ["METADATA_JSON"]).write_text(
            json.dumps(metadata, ensure_ascii=False, indent=2) + "\n",
            encoding="utf-8",
          )
          PY
          {
            echo "===== CHATGPT-READABLE KERNEL BUILD REPORT ====="
            echo "ReportSchema=chatgpt-kernel-build-report-v1"
            echo "GeneratedUTC=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo "===== HOW TO ANALYZE ====="
            echo "1. Read BUILD RESULT and KERNELSU IDENTITY first."
            echo "2. If failed, read FIRST ERROR CONTEXT before the full log."
            echo "3. Treat later errors as possible cascades from the first error."
            echo "4. If SuSFS preflight failed, inspect SUSFS PREFLIGHT and .rej files."
            echo
            echo "===== SUSFS PREFLIGHT RESULT ====="
            echo "SUSFS_PREFLIGHT_EXIT_CODE=$susfs_preflight_status"
            if [[ "$susfs_preflight_status" == "0" ]]; then
              echo "SUSFS_PREFLIGHT_RESULT=PASSED"
            elif [[ "$susfs_preflight_status" == "unknown" ]]; then
              echo "SUSFS_PREFLIGHT_RESULT=NOT_RUN"
            else
              echo "SUSFS_PREFLIGHT_RESULT=FAILED"
            fi
            echo
            echo "===== BUILD RESULT ====="
            echo "Repository=$GITHUB_REPOSITORY"
            echo "RepositoryCommit=$GITHUB_SHA"
            echo "Workflow=$GITHUB_WORKFLOW"
            echo "RunId=$GITHUB_RUN_ID"
            echo "RunNumber=$GITHUB_RUN_NUMBER"
            echo "RunAttempt=$GITHUB_RUN_ATTEMPT"
            echo "Device=$DEVICE"
            echo "Recovery=$RECOVERY_OPTION"
            echo "BUILD_EXIT_CODE=$build_status"
            if [[ "$build_status" == "0" ]]; then
              echo "BUILD_RESULT=SUCCESS"
            elif [[ "$build_status" == "unknown" ]]; then
              echo "BUILD_RESULT=NOT_STARTED_OR_INTERRUPTED"
            else
              echo "BUILD_RESULT=FAILED"
            fi
            echo
            echo "===== KERNELSU IDENTITY ====="
            echo "KSU_ENABLED=true"
            echo "KSU_REPOSITORY=$KSU_REPO"
            echo "KSU_REQUESTED_REF=$KSU_REF"
            echo "KSU_EXPECTED_SHA=$KSU_EXPECTED_SHA"
            if git -C KernelSU-Next rev-parse --is-inside-work-tree >/dev/null 2>&1; then
              echo "KSU_ACTUAL_SHA=$(git -C KernelSU-Next rev-parse HEAD)"
              echo "KSU_ACTUAL_DESCRIBE=$(git -C KernelSU-Next describe --tags --always --dirty 2>/dev/null || true)"
              echo "KSU_ACTUAL_COMMIT=$(git -C KernelSU-Next log -1 --oneline 2>/dev/null || true)"
            else
              echo "KSU_ACTUAL_SHA=unavailable"
              echo "KSU_ACTUAL_DESCRIBE=unavailable"
              echo "KSU_ACTUAL_COMMIT=unavailable"
            fi
            echo "SUSFS_ENABLED=true"
            echo "SUSFS_PATCH_SOURCE=patches/enable-susfs.patch"
            echo "SUSFS_PREFLIGHT_EXIT_CODE=$susfs_preflight_status"
            echo "SUSFS_MODE=non-blocking preflight; build proceeds and patch is retried by build.sh"
            echo
            echo "===== TOOLCHAIN ====="
            "$CLANG_DIR/bin/clang" --version 2>/dev/null | head -n 3 || true
            "$CLANG_DIR/bin/ld.lld" --version 2>/dev/null | head -n 1 || true
            echo
            echo "===== IMPORTANT KERNEL CONFIG ====="
            if [[ -f out/.config ]]; then
              grep -E \
              '^(CONFIG_LOCALVERSION=|CONFIG_KSU=|CONFIG_KSU_|CONFIG_SUSFS=|CONFIG_CC_VERSION_TEXT=|CONFIG_LTO_|CONFIG_LD_IS_LLD=|CONFIG_CC_IS_CLANG=)' \
              out/.config \
              | sort || true
            else
              echo "out/.config is unavailable."
            fi
            echo
            echo "===== OUTPUT FILES AND SHA256 ====="
            find . \
              -type f \
              \( -name '*.zip' -o -name 'Image' -o -name 'Image.gz' -o -name 'boot.img' -o -name 'vendor_boot.img' -o -name 'dtb.img' -o -name 'dtbo.img' \) \
              -not -path './.git/*' \
              -print0 \
              | sort -z \
              | while IFS= read -r -d '' file; do
                printf '%s | %s bytes | ' "$file" "$(stat -c '%s' "$file")"
                sha256sum "$file" | awk '{print $1}'
              done
            echo
            echo "===== ERROR COUNTS ====="
            printf 'fatal_error_count='
            grep -Ec 'fatal error:' "$BUILD_LOG" 2>/dev/null || true
            printf 'compiler_error_count='
            grep -Ec '(^|[[:space:]])error:' "$BUILD_LOG" 2>/dev/null || true
            printf 'linker_error_count='
            grep -Ec 'ld\.lld: error:|undefined reference' "$BUILD_LOG" 2>/dev/null || true
            printf 'warning_count='
            grep -Ec 'warning:' "$BUILD_LOG" 2>/dev/null || true
            echo
            echo "===== SUSFS PREFLIGHT ====="
            cat "$SUSFS_PREFLIGHT_LOG" 2>/dev/null \
              || echo "SuSFS preflight log is unavailable."
            echo
            echo "===== FIRST ERROR CONTEXT ====="
            cat "$ERROR_CONTEXT_LOG"
            echo
            echo "===== UNIQUE WARNINGS, TOP 100 ====="
            grep -E 'warning:' "$BUILD_LOG" 2>/dev/null \
              | sed -E 's#^.*warning: ?##' \
              | sort \
              | uniq -c \
              | sort -nr \
              | head -n 100 || true
            echo
            echo "===== EXPLICIT ERROR MARKERS, FIRST 300 ====="
            grep -nE \
            'fatal error:|(^|[[:space:]])error:|ld\.lld: error:|undefined reference|No rule to make target|FAILED|Kernel compilation failed|Traceback|Exception|ERROR:|BUILD_EXIT_CODE=' \
            "$BUILD_LOG" 2>/dev/null \
            | head -n 300 || true
            echo
            echo "===== BUILD LOG FIRST 160 LINES ====="
            head -n 160 "$BUILD_LOG" 2>/dev/null || true
            echo
            echo "===== BUILD LOG LAST 800 LINES ====="
            tail -n 800 "$BUILD_LOG" 2>/dev/null || true
            echo
            echo "===== END CHATGPT-READABLE REPORT ====="
          } > "$CHATGPT_LOG"
          while IFS= read -r -d '' file; do
            destination="$ARTIFACT_DIR/output/$file"
            mkdir -p "$(dirname "$destination")"
            cp -f "$file" "$destination"
          done < <(
            find . \
              -type f \
              \( -name '*.zip' -o -name 'Image' -o -name 'Image.gz' -o -name 'boot.img' -o -name 'vendor_boot.img' -o -name 'dtb.img' -o -name 'dtbo.img' \) \
              -not -path './.git/*' \
              -print0
          )
          cp -f "$CHATGPT_LOG" "$ARTIFACT_DIR/"
          cp -f "$ERROR_CONTEXT_LOG" "$ARTIFACT_DIR/"
          cp -f "$METADATA_JSON" "$ARTIFACT_DIR/"
          cp -f "$SUSFS_PREFLIGHT_LOG" "$ARTIFACT_DIR/" 2>/dev/null || true
          cp -f "$SUSFS_PREFLIGHT_EXIT_FILE" "$ARTIFACT_DIR/" 2>/dev/null || true
          if [[ -d "$SUSFS_REJECT_DIR" ]]; then
            cp -a "$SUSFS_REJECT_DIR" "$ARTIFACT_DIR/"
          fi
          cp -f "$BUILD_LOG" "$ARTIFACT_DIR/" 2>/dev/null || true
          cp -f "$BUILD_EXIT_FILE" "$ARTIFACT_DIR/" 2>/dev/null || true
          cp -f build.sh "$ARTIFACT_DIR/build-sh-used.txt" 2>/dev/null || true
          cp -f out/.config "$ARTIFACT_DIR/kernel-config.txt" 2>/dev/null || true
          {
            echo "# V87 Kernel build"
            echo
            echo "- Device: \`$DEVICE\`"
            echo "- KernelSU: \`$KSU_REF\`"
            echo "- Expected KSU SHA: \`$KSU_EXPECTED_SHA\`"
            echo "- SuSFS: enabled (strict compatibility test)"
            echo "- Build exit code: \`$build_status\`"
            echo
            echo "Upload \`chatgpt-readable-build-log.txt\` to ChatGPT first."
            echo "Use \`build-full.log\` only when deeper inspection is required."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Generated $CHATGPT_LOG"
          wc -l "$CHATGPT_LOG" "$ERROR_CONTEXT_LOG" "$BUILD_LOG" 2>/dev/null || true
          cat "$METADATA_JSON"
      - name: Upload build and ChatGPT-readable logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v87-${{ inputs.device }}-ksu-v3.2.0-susfs-on-chatgpt-${{ github.run_number }}
          path: chatgpt-build-artifact/**
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

name: uptime fix done BACKUP POINT

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-o1s.yml"
      - "build.sh"
      - "kernel/time/timekeeping.c"
      - "fs/stat.c"
      - "include/linux/ghost_uptime.h"
      - "patches/uptime/**"
      - "arch/arm64/configs/**"
      - "drivers/rtc/**"
      - "dt.configs/**"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: false

      - name: Free disk space
        run: |
          set -e
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/hostedtoolcache || true
          sudo apt-get clean
          df -h

      - name: Install dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            git curl wget tar xz-utils zip unzip \
            build-essential bc bison flex \
            libssl-dev libelf-dev dwarves pahole \
            python3 python3-pip \
            cpio lz4 gzip kmod rsync ca-certificates

      - name: Hard clean old outputs
        run: |
          set -e
          echo "===== CLEAN OLD OUTPUTS ====="
          rm -rf out build/out AnyKernel3
          rm -f build.log uptime-patch-report.txt Module.symvers modules.order .scmversion
          find . -name "*.o" -delete || true
          find . -name "*.mod" -delete || true
          find . -name "*.mod.c" -delete || true
          find . -name ".*.cmd" -delete || true
          find . -name ".tmp_*" -type f -delete || true
          find . -name "*.a" -delete || true
          df -h

      - name: Prepare tools
        run: |
          set -e
          echo "===== PREPARE TOOLS ====="
          mkdir -p toolchain
          rm -rf toolchain/mkbootimg toolchain/libufdt
          rm -f toolchain/mkdtimg

          git clone --depth=1 https://android.googlesource.com/platform/system/tools/mkbootimg toolchain/mkbootimg
          git clone --depth=1 https://android.googlesource.com/platform/system/libufdt toolchain/libufdt

          echo "===== FIND MKDTIMG ====="
          find toolchain/libufdt -type f | grep -iE "mkdt.*\.py|mkdtbo.*\.py" || true

          if [ -f toolchain/libufdt/utils/src/mkdtboimg.py ]; then
            cp -f toolchain/libufdt/utils/src/mkdtboimg.py toolchain/mkdtimg
          elif [ -f toolchain/libufdt/utils/mkdtboimg.py ]; then
            cp -f toolchain/libufdt/utils/mkdtboimg.py toolchain/mkdtimg
          elif [ -f toolchain/libufdt/utils/src/mkdtimg.py ]; then
            cp -f toolchain/libufdt/utils/src/mkdtimg.py toolchain/mkdtimg
          elif [ -f toolchain/libufdt/utils/mkdtimg.py ]; then
            cp -f toolchain/libufdt/utils/mkdtimg.py toolchain/mkdtimg
          else
            echo "ERROR: mkdtimg/mkdtboimg script not found"
            exit 1
          fi

          chmod +x toolchain/mkdtimg
          python3 toolchain/mkbootimg/mkbootimg.py --help >/dev/null || true
          ls -lh toolchain/mkdtimg

      - name: Cache clang
        uses: actions/cache@v5
        with:
          path: toolchain/clang-r596125
          key: clang-r596125-linux-x86-stable-v3

      - name: Setup clang
        run: |
          set -e
          echo "===== SETUP CLANG ====="
          if [ ! -x "toolchain/clang-r596125/bin/clang" ]; then
            echo "Clang not found, downloading..."
            rm -rf toolchain/clang-r596125 toolchain/clang.tar.gz
            mkdir -p toolchain/clang-r596125
            wget -O toolchain/clang.tar.gz \
              "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/mirror-goog-main-llvm-toolchain-source/clang-r596125.tar.gz"
            tar -xf toolchain/clang.tar.gz -C toolchain/clang-r596125
          fi
          toolchain/clang-r596125/bin/clang --version

      - name: Patch build.sh safety fixes only
        run: |
          set -e
          echo "===== PATCH BUILD.SH SAFETY FIXES ====="
          chmod +x build.sh

          sed -i 's#refs/heads/master/clang-r596125.tar.gz#refs/heads/mirror-goog-main-llvm-toolchain-source/clang-r596125.tar.gz#g' build.sh || true
          sed -i 's#> ../$MODEl/vendor_ramdisk#> ../vendor_ramdisk#g' build.sh || true
          sed -i 's#> ../\$MODEl/vendor_ramdisk#> ../vendor_ramdisk#g' build.sh || true
          sed -i 's#git submodule update --init --force --depth=1 --recursive#echo "skip recursive submodules in CI"#g' build.sh || true

          # Keep build.sh compatible with the single-source uptime variable form.
          sed -i 's#grep -q "u64 arch_sys_boot_offset = 0;"#grep -q "u64 arch_sys_boot_offset"#g' build.sh || true

          grep -n "clang-r596125\|vendor_ramdisk\|MODEl\|submodule\|arch_sys_boot_offset" build.sh || true

      - name: Normalize uptime patch to single source
        run: |
          set -e
          echo "===== NORMALIZE UPTIME PATCH: SINGLE SOURCE V69 ====="
          mkdir -p scripts
          cat > scripts/ci_fix_uptime_single_source.py <<'PY'
          import pathlib
          import re
          import sys
          
          ROOT = pathlib.Path('.')
          TIMEKEEPING = ROOT / 'kernel/time/timekeeping.c'
          STAT = ROOT / 'fs/stat.c'
          HEADER = ROOT / 'include/linux/ghost_uptime.h'
          REPORT = ROOT / 'uptime-patch-report.txt'
          
          
          def read(path):
              if not path.exists():
                  raise SystemExit(f'ERROR: missing {path}')
              return path.read_text(errors='ignore')
          
          
          def write(path, data):
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(data)
          
          
          def replace_once(data, old, new, what):
              if old not in data:
                  raise SystemExit(f'ERROR: anchor not found for {what}')
              return data.replace(old, new, 1)
          
          report = []
          
          # ---------------------------------------------------------------------------
          # 1) kernel/time/timekeeping.c
          #    Rule: fake uptime is applied once only by shifting boot_offset in
          #    timekeeping_init(). Never add fake nanoseconds inside timekeeping_get_delta().
          # ---------------------------------------------------------------------------
          s = read(TIMEKEEPING)
          orig_s = s
          
          # Remove old helper blocks that inject fake time into every delta read.
          s = re.sub(
              r'\n?\s*/\*\s*Fake Uptime[^*]*?(?:\*+(?!/)[^*]*)*\*/\s*'
              r'static\s+inline\s+u64\s+get_fake_boottime(?:_ns)?\s*\(\s*void\s*\)\s*\{.*?\}\s*',
              '\n',
              s,
              flags=re.S,
          )
          s = re.sub(
              r'\n?\s*static\s+inline\s+u64\s+get_fake_boottime(?:_ns)?\s*\(\s*void\s*\)\s*\{.*?\}\s*',
              '\n',
              s,
              flags=re.S,
          )
          
          # Fix the known bad duplicate signature:
          # static u64 timekeeping_get_delta(...) { static inline u64 timekeeping_get_delta(...) {
          s = re.sub(
              r'static\s+u64\s+timekeeping_get_delta\s*\(\s*const\s+struct\s+tk_read_base\s+\*tkr\s*\)\s*\{\s*'
              r'static\s+inline\s+u64\s+timekeeping_get_delta\s*\(\s*const\s+struct\s+tk_read_base\s+\*tkr\s*\)\s*\{',
              'static u64 timekeeping_get_delta(const struct tk_read_base *tkr)\n{',
              s,
              flags=re.S,
          )
          
          # Remove all stale return/addition variants in the delta path.
          s = re.sub(r'return\s+delta\s*\+\s*get_fake_boottime(?:_ns)?\s*\(\s*\)\s*;', 'return delta;', s)
          s = re.sub(
              r'return\s+tk_clock_read\s*\(\s*tkr\s*\)\s*-\s*tkr->cycle_last\s*\+\s*get_fake_boottime(?:_ns)?\s*\(\s*\)\s*;',
              'return tk_clock_read(tkr) - tkr->cycle_last;',
              s,
          )
          s = re.sub(r'\s*\+\s*get_fake_boottime(?:_ns)?\s*\(\s*\)', '', s)
          
          # Normalize arch_sys_boot_offset global to one definition.
          if 'arch_sys_boot_offset' not in s:
              anchor = 'static bool persistent_clock_exists;'
              s = replace_once(
                  s,
                  anchor,
                  anchor + '\n\n/* GHOST UPTIME SINGLE SOURCE V69 */\nu64 arch_sys_boot_offset = 0;\nEXPORT_SYMBOL_GPL(arch_sys_boot_offset);',
                  'arch_sys_boot_offset global',
              )
          else:
              # Keep one canonical non-static global symbol. Remove duplicate definitions if any.
              s = re.sub(r'/\*\s*---\s*GHOST UPTIME GLOBAL VARIABLE\s*---\s*\*/\s*', '', s)
              defs = list(re.finditer(r'\bu64\s+arch_sys_boot_offset\s*(?:=\s*0)?\s*;\s*(?:EXPORT_SYMBOL_GPL\s*\(\s*arch_sys_boot_offset\s*\)\s*;)?', s))
              if defs:
                  first = defs[0]
                  canonical = '/* GHOST UPTIME SINGLE SOURCE V69 */\nu64 arch_sys_boot_offset = 0;\nEXPORT_SYMBOL_GPL(arch_sys_boot_offset);'
                  after_first = s[first.end():]
                  after_first = re.sub(
                      r'\bu64\s+arch_sys_boot_offset\s*(?:=\s*0)?\s*;\s*(?:EXPORT_SYMBOL_GPL\s*\(\s*arch_sys_boot_offset\s*\)\s*;)?',
                      '',
                      after_first,
                  )
                  s = s[:first.start()] + canonical + after_first
          
          clean_block = r'''
          	/* GHOST UPTIME SINGLE SOURCE V69
          	 * Apply the fake boot age exactly once by shifting boot_offset.
          	 * Do not touch timekeeping_get_delta(), ktime_get(), raw clock, or scheduler clock here.
          	 */
          	{
          		u64 ghost_hw_cycles;
          		u64 ghost_seed;
          		u64 ghost_offset_secs;
          
          		asm volatile("mrs %0, cntpct_el0" : "=r" (ghost_hw_cycles));
          		ghost_seed = ghost_hw_cycles ^ ((u64)&ghost_seed >> 4);
          		ghost_seed ^= ghost_seed >> 33;
          		ghost_seed *= 0xff51afd7ed558ccdULL;
          		ghost_seed ^= ghost_seed >> 33;
          		ghost_seed *= 0xc4ceb9fe1a85ec53ULL;
          		ghost_seed ^= ghost_seed >> 33;
          
          		/* 15-25 days. If x2 appears, logs will show 30-50 days. */
          		ghost_offset_secs = 1296000ULL + (ghost_seed % 864000ULL);
          		if (wall_time.tv_sec > 0)
          			ghost_offset_secs += (u64)(wall_time.tv_sec % 1800);
          
          		boot_offset.tv_sec += ghost_offset_secs;
          		arch_sys_boot_offset = ghost_offset_secs * NSEC_PER_SEC;
          	}
          '''
          
          # Replace old GHOST PATCH block if present.
          old_block_re = re.compile(
              r'\s*/\*\s*---\s*GHOST PATCH:\s*HARDWARE ENTROPY & FMIX64\s*---\s*\*/.*?'
              r'/\*\s*-+\s*\*/',
              re.S,
          )
          s, n_old = old_block_re.subn('\n' + clean_block + '\n', s, count=1)
          
          if n_old == 0 and 'Apply the fake boot age exactly once' not in s:
              anchors = [
                  'if (timespec64_compare(&wall_time, &boot_offset) < 0)\n\t\tboot_offset = (struct timespec64){0};',
                  'if (timespec64_compare(&wall_time, &boot_offset) < 0) boot_offset = (struct timespec64){0};',
              ]
              for anchor in anchors:
                  if anchor in s:
                      s = s.replace(anchor, anchor + '\n' + clean_block, 1)
                      break
              else:
                  raise SystemExit('ERROR: cannot find timekeeping_init boot_offset anchor')
          
          # Hard fail if the bad injection path remains.
          bad_terms = ['get_fake_boottime_ns', 'get_fake_boottime()']
          for term in bad_terms:
              if term in s:
                  raise SystemExit(f'ERROR: stale bad uptime delta helper remains: {term}')
          if re.search(r'return\s+delta\s*\+', s):
              raise SystemExit('ERROR: suspicious return delta + ... remains in timekeeping_get_delta path')
          
          write(TIMEKEEPING, s)
          report.append(f'timekeeping.c changed: {orig_s != s}')
          report.append(f'timekeeping.c arch_sys_boot_offset occurrences: {s.count("arch_sys_boot_offset")}')
          report.append(f'timekeeping.c single-source marker occurrences: {s.count("GHOST UPTIME SINGLE SOURCE V69")}')
          
          # ---------------------------------------------------------------------------
          # 2) include/linux/ghost_uptime.h
          # ---------------------------------------------------------------------------
          write(HEADER, '''#ifndef _LINUX_GHOST_UPTIME_H
          #define _LINUX_GHOST_UPTIME_H
          
          #include <linux/types.h>
          
          extern u64 arch_sys_boot_offset;
          
          #endif /* _LINUX_GHOST_UPTIME_H */
          ''')
          report.append('ghost_uptime.h written')
          
          # ---------------------------------------------------------------------------
          # 3) fs/stat.c
          #    Clean old duplicated stat hook, then insert one guarded hook.
          # ---------------------------------------------------------------------------
          st = read(STAT)
          orig_st = st
          
          # Remove previous hook variants.
          st = re.sub(
              r'\n\s*/\*\s*---\s*GHOST UPTIME FOR STAT.*?/\*\s*-+\s*\*/',
              '',
              st,
              flags=re.S,
          )
          st = re.sub(
              r'\n\s*/\*\s*GHOST UPTIME FOR STAT.*?GHOST UPTIME FOR STAT END\s*\*/',
              '',
              st,
              flags=re.S,
          )
          
          # Add includes once.
          def add_include_once(data, inc):
              if inc in data:
                  return data
              include_lines = list(re.finditer(r'^#include\s+<[^>]+>\s*$', data, flags=re.M))
              if not include_lines:
                  raise SystemExit(f'ERROR: no #include anchor in {STAT}')
              last = include_lines[-1]
              return data[:last.end()] + '\n' + inc + data[last.end():]
          
          st = add_include_once(st, '#include <linux/ghost_uptime.h>')
          st = add_include_once(st, '#include <linux/math64.h>')
          
          stat_hook = r'''
          	/* GHOST UPTIME FOR STAT V69
          	 * Use the same single source offset exported by timekeeping_init().
          	 * This is for pseudo/runtime filesystem timestamps only; it must not alter clocks.
          	 */
          	if (inode->i_sb && arch_sys_boot_offset > 0) {
          		unsigned long magic = inode->i_sb->s_magic;
          		u64 ghost_stat_off = div_u64(arch_sys_boot_offset, NSEC_PER_SEC);
          
          		if (magic == 0x9fa0 || magic == 0x62656572 || magic == 0x1373 ||
          		    magic == 0x01021994 || magic == 0x73636673 || magic == 0x64626720 ||
          		    magic == 0x27e0eb || magic == 0x6e736673) {
          			if ((u64)stat->atime.tv_sec > ghost_stat_off)
          				stat->atime.tv_sec -= ghost_stat_off;
          			if ((u64)stat->mtime.tv_sec > ghost_stat_off)
          				stat->mtime.tv_sec -= ghost_stat_off;
          			if ((u64)stat->ctime.tv_sec > ghost_stat_off)
          				stat->ctime.tv_sec -= ghost_stat_off;
          		}
          	}
          '''
          
          if 'GHOST UPTIME FOR STAT V69' not in st:
              anchor = '\tstat->blocks = inode->i_blocks;'
              if anchor not in st:
                  anchor = 'stat->blocks = inode->i_blocks;'
              if anchor not in st:
                  raise SystemExit('ERROR: cannot find stat->blocks anchor in fs/stat.c')
              st = st.replace(anchor, anchor + '\n' + stat_hook, 1)
          
          write(STAT, st)
          report.append(f'stat.c changed: {orig_st != st}')
          report.append(f'stat.c stat marker occurrences: {st.count("GHOST UPTIME FOR STAT V69")}')
          
          REPORT.write_text('\n'.join(report) + '\n')
          print(REPORT.read_text())
          PY

          python3 scripts/ci_fix_uptime_single_source.py

          echo "===== DISABLE OLD PATCH FILES IN CI WORKTREE ONLY ====="
          mkdir -p patches/uptime-disabled
          find patches/uptime -maxdepth 1 -type f -name "*.patch" -print -exec sh -c 'mv "$1" "patches/uptime-disabled/$(basename "$1").disabled"' _ {} \; || true

          echo "===== VERIFY PATCH MARKERS ====="
          grep -RniE "get_fake_boottime|return[[:space:]]+delta[[:space:]]*\+|GHOST UPTIME SINGLE SOURCE V69|GHOST UPTIME FOR STAT V69|arch_sys_boot_offset" \
            kernel/time/timekeeping.c fs/stat.c include/linux/ghost_uptime.h patches/uptime patches/uptime-disabled 2>/dev/null || true

          echo "===== GIT DIFF SUMMARY ====="
          git diff -- kernel/time/timekeeping.c fs/stat.c include/linux/ghost_uptime.h patches/uptime patches/uptime-disabled | sed -n '1,260p' || true

      - name: Verify uptime patch is not x2 style
        run: |
          set -e
          echo "===== VERIFY NO DELTA INJECTION ====="
          if grep -RniE "get_fake_boottime|return[[:space:]]+delta[[:space:]]*\+|tk_clock_read\(tkr\).*get_fake" kernel/time/timekeeping.c; then
            echo "ERROR: old x2-style delta uptime injection still exists."
            exit 1
          fi

          if ! grep -q "GHOST UPTIME SINGLE SOURCE V69" kernel/time/timekeeping.c; then
            echo "ERROR: single-source uptime patch marker missing in timekeeping.c"
            exit 1
          fi

          if ! grep -q "GHOST UPTIME FOR STAT V69" fs/stat.c; then
            echo "ERROR: stat timestamp patch marker missing in fs/stat.c"
            exit 1
          fi

          echo "===== OCCURRENCE COUNTS ====="
          grep -Rno "GHOST UPTIME SINGLE SOURCE V69" kernel/time/timekeeping.c | wc -l
          grep -Rno "GHOST UPTIME FOR STAT V69" fs/stat.c | wc -l
          grep -Rno "arch_sys_boot_offset" kernel/time/timekeeping.c fs/stat.c include/linux/ghost_uptime.h | wc -l

      - name: Final clean before build
        run: |
          set -e
          rm -rf out build/out
          rm -f build.log Module.symvers modules.order .scmversion
          mkdir -p build/out/o1s
          find . -name "*.o" -delete || true
          find . -name "*.mod" -delete || true
          find . -name "*.mod.c" -delete || true
          find . -name ".*.cmd" -delete || true
          find . -name ".tmp_*" -type f -delete || true
          find . -name "*.a" -delete || true
          echo "Clean done."

      - name: Build kernel
        env:
          KSU_CHOICE: "y"
          SUSFS_CHOICE: "y"
          RECOVERY_CHOICE: "n"
        run: |
          set -e
          echo "===== BUILD o1s KERNEL ====="
          echo "KSU=$KSU_CHOICE SUSFS=$SUSFS_CHOICE RECOVERY=$RECOVERY_CHOICE"
          bash build.sh -m o1s -k "$KSU_CHOICE" -s "$SUSFS_CHOICE" -r "$RECOVERY_CHOICE" 2>&1 | tee build.log

      - name: Ensure TWRP flashable zip
        if: success()
        run: |
          set -e
          MODEL=o1s
          OUTDIR="build/out/$MODEL"
          FINAL_ZIP="$OUTDIR/TWRP-${MODEL}-KSUN-SUSFS-uptime-single-source.zip"

          echo "===== TWRP FLASHABLE ZIP CHECK ====="
          mkdir -p "$OUTDIR"

          if ! ls "$OUTDIR"/*.zip >/dev/null 2>&1; then
            echo "No zip produced by build.sh. Creating AnyKernel3 flashable zip fallback."

            for f in boot.img vendor_boot.img dtbo.img; do
              if [ ! -f "$OUTDIR/$f" ]; then
                echo "ERROR: $OUTDIR/$f missing. Cannot create TWRP flashable zip."
                find "$OUTDIR" -type f | sort || true
                exit 1
              fi
            done

            rm -rf AnyKernel3
            git clone --depth=1 -b t2s https://github.com/xfwdrev/AnyKernel3.git AnyKernel3

            rm -f AnyKernel3/boot.img AnyKernel3/vendor_boot.img AnyKernel3/dtbo.img
            cp -f "$OUTDIR/boot.img" AnyKernel3/boot.img
            cp -f "$OUTDIR/vendor_boot.img" AnyKernel3/vendor_boot.img
            cp -f "$OUTDIR/dtbo.img" AnyKernel3/dtbo.img

            if [ -f AnyKernel3/anykernel.sh ]; then
              sed -i "s/^device\.name1=.*/device.name1=$MODEL/" AnyKernel3/anykernel.sh || true
            fi

            pushd AnyKernel3 >/dev/null
            zip -r9 "../$FINAL_ZIP" * -x ".git*" "README.md" "*placeholder" >/dev/null
            popd >/dev/null
          else
            ZIP_SRC="$(ls -1t "$OUTDIR"/*.zip | head -n1)"
            if [ "$ZIP_SRC" != "$FINAL_ZIP" ]; then
              cp -f "$ZIP_SRC" "$FINAL_ZIP"
            fi
          fi

          echo "===== FINAL TWRP ZIP ====="
          ls -lh "$FINAL_ZIP"

          echo "===== ZIP CONTENT CHECK ====="
          unzip -l "$FINAL_ZIP" | tee twrp-zip-content.txt

          if ! unzip -l "$FINAL_ZIP" | grep -q "anykernel.sh"; then
            echo "ERROR: anykernel.sh missing from flashable zip."
            exit 1
          fi

          if ! unzip -l "$FINAL_ZIP" | grep -q "META-INF/com/google/android"; then
            echo "ERROR: META-INF/com/google/android missing. TWRP may not flash this zip."
            exit 1
          fi

          for f in boot.img vendor_boot.img dtbo.img; do
            if ! unzip -l "$FINAL_ZIP" | grep -q "$f"; then
              echo "ERROR: $f missing from TWRP zip."
              exit 1
            fi
          done

          echo "TWRP flashable zip is ready: $FINAL_ZIP"

      - name: Verify outputs and show errors
        if: always()
        run: |
          echo "===== OUTPUT FILES ====="
          find build/out/o1s -type f | sort || true

          echo "===== IMPORTANT ARTIFACTS ====="
          ls -lh build/out/o1s/Image 2>/dev/null || true
          ls -lh build/out/o1s/boot.img 2>/dev/null || true
          ls -lh build/out/o1s/vendor_boot.img 2>/dev/null || true
          ls -lh build/out/o1s/dtb.img 2>/dev/null || true
          ls -lh build/out/o1s/dtbo.img 2>/dev/null || true
          ls -lh build/out/o1s/*.zip 2>/dev/null || true

          echo "===== UPTIME PATCH REPORT ====="
          cat uptime-patch-report.txt 2>/dev/null || true

          echo "===== TWRP ZIP CONTENT ====="
          cat twrp-zip-content.txt 2>/dev/null || true

          echo "===== ERROR LINES ====="
          grep -i -n "error:\|fatal error:\|undefined reference\|No such file\|ld.lld:\|FAILED\|abort\|SecurityException" build.log | head -250 || true

          echo "===== LAST 250 LINES ====="
          tail -250 build.log || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: o1s-ksun-susfs-twrp-uptime-single-source
          path: |
            build.log
            uptime-patch-report.txt
            twrp-zip-content.txt
            kernel/time/timekeeping.c
            fs/stat.c
            include/linux/ghost_uptime.h
            build/out/o1s/Image
            build/out/o1s/*.img
            build/out/o1s/*.zip
            build/out/o1s/modules/**
          if-no-files-found: warn
